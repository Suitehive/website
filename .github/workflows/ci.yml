name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # The API reference is built from the OpenAPI specs committed in ./openapi
      # (refresh them with `npm run sync:openapi` when the contracts repo changes).
      - name: Build (includes the Starlight link validator)
        run: npm run build

      - name: Check links in the built site
        run: npm run check:links
