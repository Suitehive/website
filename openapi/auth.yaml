openapi: 3.1.0
info:
  title: Suitehive Auth API
  version: 0.1.0
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  description: |
    Public REST API of the **Auth** service (identity, sessions, My account, admin console, OIDC).
    Source of truth: `docs/design/03-lld-auth.md` §9.

    ## Conventions (apply to every operation)
    - JSON bodies, `camelCase` fields; timestamps are RFC 3339 in **UTC** (`2026-10-13T09:00:00Z`).
    - IDs are UUIDv7 strings.
    - Cursor pagination: `?limit=50&cursor=<opaque>` → `{ "items": [...], "nextCursor": "<opaque>" | null }`.
      `nextCursor` is `null` on the last page. Cursors are opaque; never parse them.
    - Errors are RFC 9457 `application/problem+json` with a stable `code` (see `ErrorCode`) and,
      for validation errors, `fields` (`{ "<jsonField>": "<reason code>" }`).
    - Optimistic concurrency: mutable resources return `ETag: "<version>"`; updates send `If-Match`.
      A stale `If-Match` → `412 common.precondition_failed`. Where `If-Match` is required and missing → `428`.
    - Mutating `POST`s accept an optional `Idempotency-Key` (24 h). Same key + different body → `422`.
    - Authentication:
      * Browser pages on the Auth origin use the HttpOnly session cookie `__Host-sh_session` **plus** the
        `X-CSRF` header (double-submit: its value must equal the readable cookie `__Host-sh_csrf`, which
        Auth sets on every page load and on `GET /api/auth/csrf`). The `Origin` header must be same-origin.
      * First-party SPAs (mail, calendar, admin) obtain a 10-minute access token from
        `POST /api/auth/session/token` and call APIs with `Authorization: Bearer <jwt>`.
    - Step-up: write operations on security settings may fail with `403 auth.step_up_required`;
      the client starts a challenge with `POST /api/auth/step-up`, completes it with `POST /api/auth/mfa`,
      then retries the original request.
servers:
  - url: /
    description: Same origin as the gateway (paths are absolute).
tags:
  - name: session
    description: Login, MFA, logout, password reset, token handler.
  - name: onboarding
    description: First-run setup and invitation acceptance.
  - name: account
    description: My account (self-service).
  - name: admin-users
    description: Admin console — users, lifecycle, aliases.
  - name: admin-domains
    description: Admin console — domains and verification.
  - name: admin-groups
    description: Admin console — groups and members.
  - name: admin-roles
    description: Admin console — roles, assignments, permission catalog.
  - name: admin-org
    description: Admin console — organization, policies, installed services.
  - name: admin-idps
    description: Admin console — external identity providers (federated login).
  - name: admin-audit
    description: Admin console — org-wide audit log.
  - name: oidc
    description: OpenID Connect provider endpoints (standard protocol shapes).
security:
  - bearerAuth: []
  - sessionCookie: []
    csrfHeader: []

paths:
  # ---------------------------------------------------------------- session
  /api/auth/csrf:
    get:
      tags: [session]
      operationId: getCsrfToken
      summary: Issue (or refresh) the double-submit CSRF cookie and return its value.
      security: []
      responses:
        '200':
          description: CSRF token. Also set as cookie `__Host-sh_csrf`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/discovery:
    get:
      tags: [session]
      operationId: discoverLogin
      summary: Login options for an email's domain (org branding + external IdP buttons).
      description: |
        Never reveals whether a user exists. Unknown domains return an empty `idps` list and no branding.
      security: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
            maxLength: 320
      responses:
        '200':
          description: Login options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginDiscovery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/idp/{id}/start:
    get:
      tags: [session]
      operationId: startFederatedLogin
      summary: Start a federated login at an external IdP (browser navigation). Redirects.
      description: |
        The `startUrl` of a `LoginDiscovery` button. Sets a short-lived, sealed, HttpOnly flow cookie
        (`__Host-sh_idp`, SameSite=Lax) that binds the callback to this browser, then redirects to the IdP's
        authorization endpoint (code flow, PKCE S256, nonce). A disabled, unknown or policy-disallowed provider
        redirects to `/login?error=idp_unavailable`. Too many attempts from one IP → `429`.
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: return_to
          in: query
          description: Same-origin path to land on after sign-in.
          schema:
            type: string
            maxLength: 2048
        - name: login_hint
          in: query
          description: Passed to the IdP.
          schema:
            type: string
            maxLength: 320
      responses:
        '302':
          description: Redirect to the IdP, or back to the login page with `?error=`.
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/idp/callback:
    get:
      tags: [session]
      operationId: completeFederatedLogin
      summary: Redirect URI registered at every IdP (`<public URL>/api/auth/idp/callback`). Redirects.
      description: |
        Verifies the flow cookie and `state`, redeems the code, verifies the ID token, then signs in the
        **existing** user whose address equals the IdP's *verified* email on one of the provider org's
        *verified* domains (LLD §7.8). No accounts are created (no JIT). Organization owners always sign in
        with their password. Success sets the session cookie and redirects to `return_to` (default `/`);
        any failure redirects to `/login?error=idp_failed` without saying why (reasons go to the audit log).
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Set by the IdP when the user or the IdP refused.
          schema:
            type: string
      responses:
        '302':
          description: Signed in (redirect to `return_to`) or refused (redirect to the login page).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/login:
    post:
      tags: [session]
      operationId: login
      summary: Password step of the login flow.
      description: |
        On `authenticated` the session cookie is set. On `mfa_required` the client continues with
        `POST /api/auth/mfa`. Every failure (unknown user, wrong password, suspended, locked) returns the same
        `401 auth.login.failed` body. `429` is returned only for the per-IP limit.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login step result.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/mfa:
    post:
      tags: [session]
      operationId: completeMfa
      summary: Complete an MFA challenge (login second factor or step-up).
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCompleteRequest'
      responses:
        '200':
          description: Challenge satisfied. For login challenges the session cookie is set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/step-up:
    post:
      tags: [session]
      operationId: startStepUp
      summary: Start a step-up MFA challenge for the current session.
      security:
        - sessionCookie: []
          csrfHeader: []
        - bearerAuth: []
      responses:
        '200':
          description: Challenge to complete with `POST /api/auth/mfa`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallenge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The user has no MFA method enrolled (`auth.mfa.not_enrolled`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/logout:
    post:
      tags: [session]
      operationId: logout
      summary: Revoke the current session (emits `session.revoked`, back-channel logout to clients).
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Logged out; session cookie cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/password-reset:
    post:
      tags: [session]
      operationId: requestPasswordReset
      summary: Request a password reset email. Always 202 (never reveals whether the address exists).
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/password-reset/confirm:
    post:
      tags: [session]
      operationId: confirmPasswordReset
      summary: Set a new password with a reset token. Revokes all sessions and refresh-token families.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '202':
          description: Password changed.
        '400':
          description: |
            `auth.reset.invalid_token` (unknown, used or expired token) or password policy failure
            (`common.validation_failed` with `fields.newPassword` = `too_short` | `breached`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/session/token:
    post:
      tags: [session]
      operationId: issueSessionToken
      summary: First-party token handler — exchange the session cookie for a 10-minute access token.
      description: |
        Same-origin only (Origin check + `X-CSRF`). The access token is kept **in memory only** by the SPA.
        Call again ~60 s before `expiresAt`. `401` → redirect to `/login?return_to=…`.
        A session flagged `mfa_enrollment_required` gets `403 auth.session.mfa_enrollment_required`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionTokenRequest'
      responses:
        '200':
          description: Access token + the current user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- onboarding
  /api/auth/setup:
    get:
      tags: [onboarding]
      operationId: getSetupStatus
      summary: Whether the first-run setup wizard is available (no org exists yet).
      security: []
      responses:
        '200':
          description: Setup status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [onboarding]
      operationId: bootstrapInstall
      summary: First-run bootstrap (BootstrapInstall). Disabled permanently once an org exists.
      description: Creates the org, the first (pending) domain and the owner, and signs the owner in.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '201':
          description: Installed. Session cookie set; the owner must enroll TOTP next.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: '`auth.setup.already_completed`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/auth/invitations/{token}:
    get:
      tags: [onboarding]
      operationId: getInvitation
      summary: Look up an invitation to render the accept-invite screen.
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      responses:
        '200':
          description: Invitation details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '404':
          description: '`auth.invitation.invalid_token` (unknown, accepted or expired).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/invitations/{token}:accept:
    post:
      tags: [onboarding]
      operationId: acceptInvitation
      summary: Accept an invitation by setting a password (AcceptInvitation).
      security:
        - csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: Session created (`authenticated` or `mfa_enrollment_required`).
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/consent/{requestId}:
    get:
      tags: [onboarding]
      operationId: getConsentRequest
      summary: Third-party OIDC consent request details.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ConsentRequestId'
      responses:
        '200':
          description: Consent request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [onboarding]
      operationId: decideConsent
      summary: Allow or deny a third-party consent request.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ConsentRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentDecision'
      responses:
        '200':
          description: Where to send the browser next (the client's redirect URI with code or error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- account
  /api/auth/me:
    get:
      tags: [account]
      operationId: getMe
      summary: Current user's profile.
      responses:
        '200':
          description: Profile.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [account]
      operationId: updateMe
      summary: Update the current user's profile (omitted fields are unchanged).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MePatch'
      responses:
        '200':
          description: Updated profile.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /api/auth/me/avatar:
    put:
      tags: [account]
      operationId: uploadMyAvatar
      summary: Upload a (client-cropped) avatar image, max 2 MB.
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
    delete:
      tags: [account]
      operationId: deleteMyAvatar
      summary: Remove the avatar.
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me/apps:
    get:
      tags: [account]
      operationId: listMyApps
      summary: App switcher — installed services the user can use.
      responses:
        '200':
          description: Apps in display order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me/password:
    put:
      tags: [account]
      operationId: changeMyPassword
      summary: Change password (step-up required). Revokes all other sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/me/security:
    get:
      tags: [account]
      operationId: getMySecurity
      summary: Security overview (password, MFA methods, policy).
      responses:
        '200':
          description: Security overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me/sessions:
    get:
      tags: [account]
      operationId: listMySessions
      summary: Active sessions (devices).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Sessions, most recently active first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [account]
      operationId: revokeOtherSessions
      summary: Sign out all other sessions (keeps the current one).
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me/sessions/{id}:
    delete:
      tags: [account]
      operationId: revokeMySession
      summary: Sign out one session.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/me/mfa/totp:
    post:
      tags: [account]
      operationId: startTotpEnrollment
      summary: Start TOTP enrollment (step-up required unless the session is in forced enrollment).
      description: The seed is returned only here; it is never returned again after confirmation.
      responses:
        '200':
          description: Enrollment secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [account]
      operationId: removeTotp
      summary: Remove the authenticator app (step-up). Rejected if MFA is required and it is the last method.
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/auth/me/mfa/totp:confirm:
    post:
      tags: [account]
      operationId: confirmTotpEnrollment
      summary: Confirm TOTP enrollment with a code. Returns recovery codes when this is the first MFA method.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirmRequest'
      responses:
        '200':
          description: Enrolled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollmentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me/mfa/webauthn/registration-options:
    post:
      tags: [account]
      operationId: startWebauthnRegistration
      summary: Get WebAuthn `PublicKeyCredentialCreationOptions` for registering a passkey (step-up).
      responses:
        '200':
          description: Creation options (WebAuthn JSON, base64url-encoded buffers).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebauthnRegistrationOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/me/mfa/webauthn:
    post:
      tags: [account]
      operationId: finishWebauthnRegistration
      summary: Register a passkey with the attestation response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebauthnRegistrationRequest'
      responses:
        '201':
          description: Registered. `recoveryCodes` is present when this is the first MFA method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollmentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/me/mfa/webauthn/{id}:
    patch:
      tags: [account]
      operationId: renameWebauthnCredential
      summary: Rename a passkey.
      parameters:
        - $ref: '#/components/parameters/CredentialId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRequest'
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebauthnCredential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [account]
      operationId: removeWebauthnCredential
      summary: Remove a passkey (step-up).
      parameters:
        - $ref: '#/components/parameters/CredentialId'
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/auth/me/mfa/recovery-codes:
    post:
      tags: [account]
      operationId: regenerateRecoveryCodes
      summary: Regenerate the 10 recovery codes (step-up). Old codes stop working. Shown once.
      responses:
        '200':
          description: New codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/auth/me/app-passwords:
    get:
      tags: [account]
      operationId: listAppPasswords
      summary: App passwords (secrets are never returned).
      responses:
        '200':
          description: App passwords (unrevoked), newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppPasswordList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [account]
      operationId: createAppPassword
      summary: Create an app password (step-up). The secret is shown exactly once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppPasswordCreateRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppPasswordCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`auth.step_up_required` or `auth.app_password.disabled_by_policy`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/auth/me/app-passwords/{id}:
    delete:
      tags: [account]
      operationId: revokeAppPassword
      summary: Revoke an app password (emits `app_password.revoked`).
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/me/tokens:
    get:
      tags: [account]
      operationId: listApiTokens
      summary: Personal access tokens.
      responses:
        '200':
          description: Tokens (unrevoked), newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [account]
      operationId: createApiToken
      summary: Create a personal access token (step-up). The secret (`sh_pat_…`) is shown exactly once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreateRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/me/tokens/{id}:
    delete:
      tags: [account]
      operationId: revokeApiToken
      summary: Revoke a personal access token.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/me/connected-apps:
    get:
      tags: [account]
      operationId: listConnectedApps
      summary: Third-party OIDC grants.
      responses:
        '200':
          description: Grants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAppList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me/connected-apps/{clientId}:
    delete:
      tags: [account]
      operationId: revokeConnectedApp
      summary: Revoke a third-party grant (revokes its refresh-token families).
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- admin: users
  /api/admin/users:
    get:
      tags: [admin-users]
      operationId: adminListUsers
      summary: List users (permission `auth.user.read`).
      parameters:
        - name: q
          in: query
          description: Free text over name and addresses.
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/UserStatus'
          style: form
          explode: false
        - name: roleId
          in: query
          schema:
            type: string
            format: uuid
        - name: domainId
          in: query
          schema:
            type: string
            format: uuid
        - name: mfaEnabled
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [displayName, email, status, lastSignInAt, createdAt]
            default: displayName
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin-users]
      operationId: adminInviteUser
      summary: Invite a user (InviteUser, permission `auth.user.create`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteUserRequest'
      responses:
        '201':
          description: User created in state `invited`; invitation email queued.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'

  /api/admin/users/{id}:
    get:
      tags: [admin-users]
      operationId: adminGetUser
      summary: Get a user (cross-tenant ids → 404).
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: User.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [admin-users]
      operationId: adminUpdateUser
      summary: Update a user's profile fields (permission `auth.user.update`).
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserPatch'
      responses:
        '200':
          description: Updated user.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /api/admin/users/{id}:suspend:
    post:
      tags: [admin-users]
      operationId: adminSuspendUser
      summary: Suspend (revokes sessions, refresh families, app passwords, PATs). Permission `auth.user.suspend`.
      description: 'Errors: `auth.user.last_owner`, `auth.user.self_action`, `auth.user.invalid_transition` (409).'
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendUserRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminUserOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /api/admin/users/{id}:reactivate:
    post:
      tags: [admin-users]
      operationId: adminReactivateUser
      summary: Reactivate a suspended user. Permission `auth.user.suspend`.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          $ref: '#/components/responses/AdminUserOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /api/admin/users/{id}:delete:
    post:
      tags: [admin-users]
      operationId: adminDeleteUser
      summary: Delete a user (soft; PII purged after the org's retention). Permission `auth.user.delete`.
      description: An `invited` user is revoked (also → `deleted`). Response carries `purgeAfter`.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUserRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminUserOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /api/admin/users/{id}:resetMfa:
    post:
      tags: [admin-users]
      operationId: adminResetUserMfa
      summary: Remove all MFA methods of a user (they re-enroll at next login if required). Permission `auth.user.update`.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/AdminUserOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/users/{id}:resetPassword:
    post:
      tags: [admin-users]
      operationId: adminResetUserPassword
      summary: Send a password-reset link to the user's contact/primary address. Permission `auth.user.update`.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: Reset email queued.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/users/{id}:resendInvitation:
    post:
      tags: [admin-users]
      operationId: adminResendInvitation
      summary: Issue a fresh 7-day invitation token and resend the email (user must be `invited`).
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: Invitation queued.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/users/{id}/addresses:
    get:
      tags: [admin-users]
      operationId: adminListUserAddresses
      summary: Primary address and aliases of a user.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [admin-users]
      operationId: adminAddUserAlias
      summary: Add an alias address (must be on a verified domain of the org and free).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAliasRequest'
      responses:
        '201':
          description: Alias added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/users/{id}/addresses/{addressId}:
    delete:
      tags: [admin-users]
      operationId: adminRemoveUserAlias
      summary: Remove an alias (the primary address cannot be removed).
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: addressId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------- admin: domains
  /api/admin/domains:
    get:
      tags: [admin-domains]
      operationId: adminListDomains
      summary: List domains (permission `auth.domain.manage`).
      responses:
        '200':
          description: Domains.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin-domains]
      operationId: adminAddDomain
      summary: Add a domain (AddDomain). Starts `pending` with a TXT verification token.
      description: 'Errors: `auth.domain.public_suffix` (400), `auth.domain.claimed_elsewhere` (409), `auth.domain.already_added` (409).'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDomainRequest'
      responses:
        '201':
          description: Domain added.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/domains/{id}:
    get:
      tags: [admin-domains]
      operationId: adminGetDomain
      summary: Get a domain.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Domain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [admin-domains]
      operationId: adminRemoveDomain
      summary: Remove a domain. `409 auth.domain.has_addresses` while addresses still use it.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/domains/{id}:verify:
    post:
      tags: [admin-domains]
      operationId: adminVerifyDomain
      summary: Check the TXT record now (VerifyDomain).
      description: |
        Returns the domain in its new state. A failed check is **not** an error: the domain stays `pending`
        and `lastCheck.result` is `not_found` | `mismatch`.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Domain after the check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

