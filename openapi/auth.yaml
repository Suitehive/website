      summary: Remove a member.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- admin: roles
  /api/admin/roles:
    get:
      tags: [admin-roles]
      operationId: adminListRoles
      summary: Built-in and custom roles (permission `auth.role.read`).
      responses:
        '200':
          description: Roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin-roles]
      operationId: adminCreateRole
      summary: Create a custom role (permission `auth.role.manage`). You cannot include permissions you don't hold.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/roles/{id}:
    patch:
      tags: [admin-roles]
      operationId: adminUpdateRole
      summary: Update a custom role. Built-in roles → `403 auth.role.builtin_readonly`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePatch'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [admin-roles]
      operationId: adminDeleteRole
      summary: Delete a custom role (its assignments are removed).
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/role-assignments:
    get:
      tags: [admin-roles]
      operationId: adminListRoleAssignments
      summary: Role assignments, filterable by role or principal.
      parameters:
        - name: roleId
          in: query
          schema:
            type: string
            format: uuid
        - name: principalType
          in: query
          schema:
            $ref: '#/components/schemas/PrincipalType'
        - name: principalId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin-roles]
      operationId: adminAssignRole
      summary: Assign a role (AssignRole). `403 auth.role.privilege_escalation` / `auth.role.owner_grant_requires_owner`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentInput'
      responses:
        '201':
          description: Assigned. Idempotent — an existing identical assignment is returned as is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/role-assignments/{assignmentId}:
    delete:
      tags: [admin-roles]
      operationId: adminUnassignRole
      summary: Remove an assignment. Removing the last owner → `409 auth.user.last_owner`.
      parameters:
        - name: assignmentId
          in: path
          required: true
          description: Opaque id from `RoleAssignment.id`.
          schema:
            type: string
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/permissions:
    get:
      tags: [admin-roles]
      operationId: adminListPermissions
      summary: Permission catalog contributed by all registered services.
      responses:
        '200':
          description: Permissions grouped by `serviceId` on the client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- admin: org
  /api/admin/org:
    get:
      tags: [admin-org]
      operationId: adminGetOrg
      summary: Organization settings (permission `auth.org.manage`).
      responses:
        '200':
          description: Organization.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [admin-org]
      operationId: adminUpdateOrg
      summary: Update name / slug / branding.
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationPatch'
      responses:
        '200':
          description: Updated.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /api/admin/org/logo:
    put:
      tags: [admin-org]
      operationId: adminUploadOrgLogo
      summary: Upload the org logo (shown on login and in the shell), max 1 MB.
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/svg+xml:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Updated organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
    delete:
      tags: [admin-org]
      operationId: adminDeleteOrgLogo
      summary: Remove the org logo.
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/org/policy:
    get:
      tags: [admin-org]
      operationId: adminGetOrgPolicy
      summary: Security policies.
      responses:
        '200':
          description: Policy.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [admin-org]
      operationId: adminUpdateOrgPolicy
      summary: Update security policies (omitted fields unchanged).
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgPolicyPatch'
      responses:
        '200':
          description: Updated.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /api/admin/idps:
    get:
      tags: [admin-idps]
      operationId: adminListIdentityProviders
      summary: External identity providers of the org (permission `auth.org.manage`).
      responses:
        '200':
          description: Providers. Client secrets are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProviderList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin-idps]
      operationId: adminCreateIdentityProvider
      summary: Add an external IdP (org owners only, `auth.org.manage`, step-up).
      description: |
        A provider signs people in only while it is `enabled` **and** its `slug` is listed in
        `OrgPolicy.allowedIdPs`. Writes need a second factor within the last 10 minutes
        (`403 auth.step_up_required`; users without any factor: a login within 10 minutes).
        A duplicate slug, or more than 20 providers, is `409 common.conflict`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityProviderInput'
      responses:
        '201':
          description: Created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProvider'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/idps/{id}:
    get:
      tags: [admin-idps]
      operationId: adminGetIdentityProvider
      summary: One external IdP (permission `auth.org.manage`).
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Provider.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProvider'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [admin-idps]
      operationId: adminUpdateIdentityProvider
      summary: Change an external IdP (org owners only, step-up). `kind` and `slug` are immutable.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityProviderPatch'
      responses:
        '200':
          description: Updated.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProvider'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags: [admin-idps]
      operationId: adminDeleteIdentityProvider
      summary: Remove an external IdP (org owners only, step-up). Existing sessions are not affected.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/services:
    get:
      tags: [admin-org]
      operationId: adminListServices
      summary: Installed apps + health; also the manifest for app-contributed admin sections.
      responses:
        '200':
          description: Services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- admin: audit
  /api/admin/audit:
    get:
      tags: [admin-audit]
      operationId: adminSearchAudit
      summary: Org-wide audit search (permission `auth.audit.read`), newest first.
      parameters:
        - name: q
          in: query
          description: Free text over action, actor and target display names.
          schema:
            type: string
            maxLength: 200
        - name: actorId
          in: query
          schema:
            type: string
        - name: targetId
          in: query
          schema:
            type: string
        - name: action
          in: query
          description: Exact action or prefix ending in `.*`, e.g. `auth.user.*`.
          schema:
            type: string
        - name: service
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            $ref: '#/components/schemas/AuditOutcome'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/audit/stream:
    get:
      tags: [admin-audit]
      operationId: adminStreamAudit
      summary: Live tail (SSE). Notifications only — fetch new entries with `GET /api/admin/audit?from=`.
      description: |
        Server-Sent Events. Heartbeat comment every 25 s. Reconnect with `Last-Event-ID`.
        Each event: `id: <cursor>`, `event: audit`, `data: <RealtimeNotification JSON>`.
      parameters:
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE stream whose `data` lines are `RealtimeNotification` JSON.
              x-sse-data-schema:
                $ref: '#/components/schemas/RealtimeNotification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- OIDC
  /.well-known/openid-configuration:
    get:
      tags: [oidc]
      operationId: oidcDiscovery
      summary: OpenID Provider metadata.
      security: []
      responses:
        '200':
          description: Provider metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcProviderMetadata'
        '404':
          $ref: '#/components/responses/NotFound'

  /jwks:
    get:
      tags: [oidc]
      operationId: oidcJwks
      summary: Signing keys (ES256). Two keys are published during rotation overlap.
      security: []
      responses:
        '200':
          description: JWK set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
        '404':
          $ref: '#/components/responses/NotFound'

  /oauth2/authorize:
    get:
      tags: [oidc]
      operationId: oidcAuthorize
      summary: Authorization endpoint (code flow, PKCE S256 required). Redirects.
      security: []
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: nonce, in: query, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - { name: prompt, in: query, schema: { type: string, enum: [none, login, consent] } }
        - { name: login_hint, in: query, schema: { type: string } }
      responses:
        '302':
          description: Redirect to the login/consent page or back to `redirect_uri` with `code`/`error`.
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/BadRequest'

  /oauth2/token:
    post:
      tags: [oidc]
      operationId: oidcToken
      summary: Token endpoint (authorization_code, refresh_token, client_credentials).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OidcTokenRequest'
      responses:
        '200':
          description: Tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcTokenResponse'
        '400':
          description: OAuth 2.0 error (RFC 6749 §5.2), e.g. `invalid_grant` on refresh-token reuse (family revoked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: '`invalid_client`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /oauth2/revoke:
    post:
      tags: [oidc]
      operationId: oidcRevoke
      summary: Token revocation (RFC 7009).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OidcRevokeRequest'
      responses:
        '200':
          description: Revoked (also for unknown tokens).
        '400':
          description: OAuth error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /oauth2/introspect:
    post:
      tags: [oidc]
      operationId: oidcIntrospect
      summary: Token introspection (RFC 7662); client authentication required.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OidcIntrospectRequest'
      responses:
        '200':
          description: Introspection result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcIntrospection'
        '401':
          description: '`invalid_client`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /oauth2/userinfo:
    get:
      tags: [oidc]
      operationId: oidcUserinfo
      summary: UserInfo endpoint.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcUserInfo'
        '401':
          description: Invalid token (`WWW-Authenticate` header per RFC 6750).

  /oauth2/end_session:
    get:
      tags: [oidc]
      operationId: oidcEndSession
      summary: RP-initiated logout. Revokes the session and redirects.
      security: []
      parameters:
        - { name: id_token_hint, in: query, schema: { type: string } }
        - { name: client_id, in: query, schema: { type: string } }
        - { name: post_logout_redirect_uri, in: query, schema: { type: string, format: uri } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        '302':
          description: Redirect to `post_logout_redirect_uri` (if registered) or `/login`.
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ES256 access token from Auth (10 min); `aud` must include `auth`.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-sh_session
      description: HttpOnly Auth session cookie (`Secure; SameSite=Lax`).
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF
      description: Double-submit CSRF token; must equal the `__Host-sh_csrf` cookie.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialId:
      name: id
      in: path
      required: true
      description: WebAuthn credential id (base64url).
      schema:
        type: string
    InvitationToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 256
    ConsentRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`.
      schema:
        type: string
        maxLength: 1024
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IfMatch:
      name: If-Match
      in: header
      description: '`"<version>"` from the resource''s `ETag`. Optional here; when sent it is enforced.'
      schema:
        type: string
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: '`"<version>"` from the resource''s `ETag`.'
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-generated unique key (UUID recommended); replays return the first response for 24 h.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    LastEventId:
      name: Last-Event-ID
      in: header
      description: Resume an SSE stream after this event id.
      schema:
        type: string

  headers:
    ETag:
      description: '`"<version>"` of the returned resource.'
      schema:
        type: string
    Location:
      description: URL of the created resource or redirect target.
      schema:
        type: string
    RetryAfter:
      description: Seconds until the request may be retried.
      schema:
        type: integer
    SetSessionCookie:
      description: '`__Host-sh_session=…; Path=/; HttpOnly; Secure; SameSite=Lax` (set only when a session is created).'
      schema:
        type: string

  responses:
    BadRequest:
      description: Malformed request or validation failure (`common.validation_failed` with `fields`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Not authenticated (`common.unauthenticated`, `auth.login.failed`, `auth.mfa.invalid_code`, …).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Not allowed (`common.forbidden`, `auth.step_up_required`, `auth.csrf_failed`, …).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found (also for other tenants' ids).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict (invariant or uniqueness violation); see `code`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: '`If-Match` does not match the current version (`common.precondition_failed`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: '`If-Match` is required (`common.precondition_required`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyMismatch:
      description: Same `Idempotency-Key` reused with a different body (`common.idempotency_key_reused`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Body too large (`common.payload_too_large`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limited (`common.rate_limited`); see `Retry-After`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AdminUserOk:
      description: The user after the action.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminUser'

  schemas:
    # ------------------------------------------------------------ common
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: URI reference; `about:blank` or `https://suitehive.org/problems/<code>`.
        title:
          type: string
          description: Short, client-safe summary.
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable code; see `ErrorCode` for the known values.
          examples: [auth.user.last_owner]
        fields:
          type: object
          description: 'Validation details: field name (JSON pointer for nested fields) to reason code.'
          additionalProperties:
            type: string
        requestId:
          type: string
          description: Correlation id to show to the user for support.
        retryAfterSeconds:
          type: integer
          description: Present for rate limits / lockouts.
    ErrorCode:
      type: string
      description: Known `Problem.code` values for this service (common + auth).
      enum:
        - common.invalid_json
        - common.validation_failed
        - common.unauthenticated
        - common.forbidden
        - common.not_found
        - common.conflict
        - common.precondition_failed
        - common.precondition_required
        - common.idempotency_key_required
        - common.idempotency_key_reused
        - common.rate_limited
        - common.payload_too_large
        - common.unsupported_media_type
        - common.cursor_expired
        - common.internal
        - common.unavailable
        - auth.login.failed
        - auth.mfa.invalid_code
        - auth.mfa.challenge_expired
        - auth.mfa.not_enrolled
        - auth.mfa.last_method_required
        - auth.step_up_required
        - auth.session.mfa_enrollment_required
        - auth.csrf_failed
        - auth.token.audience_not_allowed
        - auth.password.too_short
        - auth.password.breached
        - auth.password.incorrect
        - auth.reset.invalid_token
        - auth.invitation.invalid_token
        - auth.setup.already_completed
        - auth.user.invalid_transition
        - auth.user.last_owner
        - auth.user.self_action
        - auth.user.address_taken
        - auth.user.domain_not_verified
        - auth.user.primary_address_immutable
        - auth.domain.public_suffix
        - auth.domain.invalid_name
        - auth.domain.already_added
        - auth.domain.claimed_elsewhere
        - auth.domain.has_addresses
        - auth.group.cycle
        - auth.group.max_depth
        - auth.group.external_not_allowed
        - auth.group.member_exists
        - auth.role.privilege_escalation
        - auth.role.owner_grant_requires_owner
        - auth.role.builtin_readonly
        - auth.role.name_taken
        - auth.role.unknown_permission
        - auth.app_password.disabled_by_policy
        - auth.org.slug_taken
    Page:
      type: object
      required: [items, nextCursor]
      properties:
        nextCursor:
          type: [string, 'null']
    CsrfToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
    RedirectResponse:
      type: object
      required: [redirectTo]
      properties:
        redirectTo:
          type: string
          description: Absolute or same-origin URL to navigate to.
    RealtimeNotification:
      type: object
      description: SSE payload — "something changed" + cursor, never data.
      required: [topic, cursor]
      properties:
        topic:
          type: string
          enum: [audit, session]
        cursor:
          type: string
        reason:
          type: string
          description: For `session`, e.g. `revoked`.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC.

    # ------------------------------------------------------------ session
    LoginDiscovery:
      type: object
      required: [idps]
      properties:
        orgName:
          type: [string, 'null']
        logoUrl:
          type: [string, 'null']
        idps:
          type: array
          items:
            $ref: '#/components/schemas/IdentityProviderButton'
    IdentityProviderButton:
      type: object
      required: [id, kind, displayName, startUrl]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [google, microsoft, oidc, saml]
        displayName:
          type: string
        startUrl:
          type: string
          description: Navigate the browser here to start federation.
    IdentityProviderKind:
      type: string
      enum: [google, microsoft, oidc]
      description: |
        All speak OpenID Connect. `google` presets the issuer `https://accounts.google.com`;
        `microsoft` needs the tenant-specific issuer `https://login.microsoftonline.com/<tenant-id>/v2.0`
        (and the `xms_edov` optional claim, since Entra ID sends no `email_verified`).
    IdentityProvider:
      type: object
      required: [id, slug, kind, displayName, issuer, clientId, hasClientSecret, scopes, enabled, allowedByPolicy, redirectUri, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
          description: The id `OrgPolicy.allowedIdPs` refers to.
        kind:
          $ref: '#/components/schemas/IdentityProviderKind'
        displayName:
          type: string
          description: Button label ("Continue with <displayName>").
        issuer:
          type: string
          format: uri
        clientId:
          type: string
        hasClientSecret:
          type: boolean
          description: A client secret is stored (encrypted). It is never returned.
        scopes:
          type: array
          items:
            type: string
          description: Requested scopes; always includes `openid`, `email`, `profile`.
        enabled:
          type: boolean
        allowedByPolicy:
          type: boolean
          description: The slug is listed in `OrgPolicy.allowedIdPs` (both are needed for sign-in).
        redirectUri:
          type: string
          format: uri
          description: Register this redirect URI at the IdP.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
    IdentityProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IdentityProvider'
    IdentityProviderInput:
      type: object
      required: [kind, clientId]
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
          description: Defaults to the kind for `google` / `microsoft`; required for `oidc`.
        kind:
          $ref: '#/components/schemas/IdentityProviderKind'
        displayName:
          type: string
          maxLength: 80
          description: Defaults to "Google" / "Microsoft"; required for `oidc`.
        issuer:
          type: string
          format: uri
          maxLength: 512
          description: HTTPS issuer URL (OIDC discovery). Defaults for `google`.
        clientId:
          type: string
          minLength: 1
          maxLength: 512
        clientSecret:
          type: string
          maxLength: 4096
          description: Omit for public clients (PKCE only).
        scopes:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 128
        enabled:
          type: boolean
          default: false
    IdentityProviderPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          maxLength: 80
        issuer:
          type: string
          format: uri
          maxLength: 512
        clientId:
          type: string
          minLength: 1
          maxLength: 512
        clientSecret:
          type: string
          maxLength: 4096
          description: Replaces the stored secret; an empty string removes it.
        scopes:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 128
        enabled:
          type: boolean
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
        returnTo:
          type: string
          description: Same-origin path; validated against installed app paths (no open redirects).
          maxLength: 2048
    LoginResult:
      description: Discriminated by `status`.
      oneOf:
        - $ref: '#/components/schemas/LoginAuthenticated'
        - $ref: '#/components/schemas/LoginMfaRequired'
        - $ref: '#/components/schemas/LoginMfaEnrollmentRequired'
      discriminator:
        propertyName: status
        mapping:
          authenticated: '#/components/schemas/LoginAuthenticated'
          mfa_required: '#/components/schemas/LoginMfaRequired'
          mfa_enrollment_required: '#/components/schemas/LoginMfaEnrollmentRequired'
    LoginAuthenticated:
      type: object
      required: [status, redirectTo]
      properties:
        status:
          type: string
          const: authenticated
        redirectTo:
          type: string
          description: Validated `returnTo`, else the last used app path.
        stepUpUntil:
          $ref: '#/components/schemas/Timestamp'
          description: Present after a step-up challenge; privileged writes are allowed until then.
    LoginMfaRequired:
      type: object
      required: [status, challenge]
      properties:
        status:
          type: string
          const: mfa_required
        challenge:
          $ref: '#/components/schemas/MfaChallenge'
    LoginMfaEnrollmentRequired:
      type: object
      required: [status, redirectTo]
      description: Session exists but only enrollment endpoints are allowed until MFA is set up.
      properties:
        status:
          type: string
          const: mfa_enrollment_required
        redirectTo:
          type: string
          description: The enrollment page, e.g. `/account/security/setup`.
    MfaMethod:
      type: string
      enum: [totp, webauthn, recovery_code]
    MfaChallenge:
      type: object
      required: [id, purpose, methods, expiresAt]
      properties:
        id:
          type: string
        purpose:
          type: string
          enum: [login, step_up]
        methods:
          type: array
          description: Available methods, preferred first (passkey first when enrolled).
          items:
            $ref: '#/components/schemas/MfaMethod'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        webauthn:
          $ref: '#/components/schemas/WebauthnAssertionOptions'
    WebauthnAssertionOptions:
      type: object
      description: '`PublicKeyCredentialRequestOptionsJSON` (WebAuthn L3), buffers base64url.'
      additionalProperties: true
      required: [challenge]
      properties:
        challenge:
          type: string
        rpId:
          type: string
        timeout:
          type: integer
        userVerification:
          type: string
          enum: [required, preferred, discouraged]
        allowCredentials:
          type: array
          items:
            type: object
            required: [id, type]
            properties:
              id:
                type: string
              type:
                type: string
                const: public-key
              transports:
                type: array
                items:
                  type: string
    MfaCompleteRequest:
      type: object
      required: [challengeId, method]
      additionalProperties: false
      properties:
        challengeId:
          type: string
        method:
          $ref: '#/components/schemas/MfaMethod'
        code:
          type: string
          description: TOTP code (6 digits) or recovery code. Required for `totp` / `recovery_code`.
          maxLength: 64
        webauthnResponse:
          type: object
          description: '`AuthenticationResponseJSON` from `navigator.credentials.get`. Required for `webauthn`.'
          additionalProperties: true
    PasswordResetRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      additionalProperties: false
      properties:
        token:
          type: string
          maxLength: 256
        newPassword:
          type: string
          minLength: 12
          maxLength: 1024
    SessionTokenRequest:
      type: object
      required: [audience]
      additionalProperties: false
      properties:
        audience:
          type: array
          minItems: 1
          maxItems: 20
          description: Registered service ids the token must be valid for, e.g. `["mail","calendar"]`.
          items:
            type: string
            pattern: '^[a-z][a-z0-9-]{1,30}$'
    SessionTokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, expiresAt, audience, user]
      properties:
        accessToken:
          type: string
          description: ES256 JWT. Keep in memory only.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Seconds (600).
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        audience:
          type: array
          items:
            type: string
        user:
          $ref: '#/components/schemas/Me'

    # ------------------------------------------------------------ onboarding
    SetupStatus:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
          description: True only when no organization exists.
    SetupRequest:
      type: object
      required: [orgName, orgSlug, domain, admin]
      additionalProperties: false
      properties:
        orgName:
          type: string
          minLength: 1
          maxLength: 120
        orgSlug:
          $ref: '#/components/schemas/OrgSlug'
        domain:
          type: string
          description: First domain (IDNA allowed; normalized server-side).
          maxLength: 253
        admin:
          type: object
          required: [displayName, localPart, password]
          additionalProperties: false
          properties:
            displayName:
              type: string
              minLength: 1
              maxLength: 200
            givenName:
              type: string
              maxLength: 100
            familyName:
              type: string
              maxLength: 100
            localPart:
              type: string
              description: Local part on `domain`, e.g. `admin` → `admin@<domain>`.
              maxLength: 64
            password:
              type: string
              minLength: 12
              maxLength: 1024
            locale:
              type: string
              examples: [en-US]
            timeZone:
              type: string
              examples: [Europe/Berlin]
    SetupResult:
      type: object
      required: [org, domain, user, redirectTo]
      properties:
        org:
          $ref: '#/components/schemas/Organization'
        domain:
          $ref: '#/components/schemas/Domain'
        user:
          $ref: '#/components/schemas/Me'
        redirectTo:
          type: string
          description: The TOTP enrollment page.
    Invitation:
      type: object
      required: [email, displayName, orgName, mfaRequired, passwordPolicy, expiresAt]
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
        orgName:
          type: string
        orgLogoUrl:
          type: [string, 'null']
        mfaRequired:
          type: boolean
          description: Whether 2-step enrollment follows the password step.
        passwordPolicy:
          $ref: '#/components/schemas/PasswordPolicy'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    PasswordPolicy:
      type: object
      required: [minLength, checkBreached]
      properties:
        minLength:
          type: integer
          minimum: 12
        checkBreached:
          type: boolean
    AcceptInvitationRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 1024
    ConsentRequest:
      type: object
      required: [id, client, scopes]
      properties:
        id:
          type: string
        client:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
            logoUrl:
              type: [string, 'null']
            homepageUrl:
              type: [string, 'null']
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopeDescription'
    ScopeDescription:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string
    ConsentDecision:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [allow, deny]

    # ------------------------------------------------------------ users / profile
    UserStatus:
      type: string
      enum: [invited, active, suspended, deleted]
    UserPreferences:
      type: object
      description: Cross-app UI preferences stored with the profile.
      properties:
        theme:
          type: string
          enum: [system, light, dark]
          default: system
        density:
          type: string
          enum: [comfortable, compact]
          default: comfortable
        readingFont:
          type: string
          enum: [sans, serif]
          default: sans
        dateFormat:
          type: string
          enum: [locale, iso, dmy, mdy]
          default: locale
        timeFormat:
          type: string
          enum: [locale, h12, h24]
          default: locale
    Me:
      type: object
      required: [id, orgId, email, displayName, locale, timeZone, status, roles, permissions, isOrgOwner, mfaEnabled, preferences, version]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        orgName:
          type: string
        email:
          type: string
          format: email
          description: Primary address.
        displayName:
          type: string
        givenName:
          type: [string, 'null']
        familyName:
          type: [string, 'null']
        locale:
          type: string
          description: BCP 47 tag.
          examples: [en-US]
        timeZone:
          type: string
          description: IANA time zone.
          examples: [Europe/Berlin]
        avatarUrl:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/UserStatus'
        roles:
          type: array
          description: Role names (built-in `owner|admin|user_admin|helpdesk|member` or custom).
          items:
            type: string
        permissions:
          type: array
          description: Effective permissions (union of roles), used to show/hide admin UI.
          items:
            type: string
        isOrgOwner:
          type: boolean
        mfaEnabled:
          type: boolean
        preferences:
          $ref: '#/components/schemas/UserPreferences'
        version:
          type: integer
    MePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        givenName:
          type: [string, 'null']
          maxLength: 100
        familyName:
          type: [string, 'null']
          maxLength: 100
        locale:
          type: string
          maxLength: 35
        timeZone:
          type: string
          maxLength: 64
        preferences:
          $ref: '#/components/schemas/UserPreferences'
    AppLink:
      type: object
      required: [id, name, url, icon]
      properties:
        id:
          type: string
          examples: [mail]
        name:
          type: string
          examples: [Mail]
        url:
          type: string
          description: Entry URL of the app's web UI, e.g. `/mail`.
        icon:
          type: string
          description: Icon key (lucide name) or image URL.
    AppList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppLink'
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          maxLength: 1024
        newPassword:
          type: string
          minLength: 12
          maxLength: 1024
    SecurityOverview:
      type: object
      required: [passwordPolicy, mfaRequired, totp, webauthn, recoveryCodesRemaining]
      properties:
        passwordChangedAt:
          type: [string, 'null']
          format: date-time
        passwordPolicy:
          $ref: '#/components/schemas/PasswordPolicy'
        mfaRequired:
          type: boolean
          description: True if org policy requires MFA for this user.
        totp:
          type: object
          required: [enrolled]
          properties:
            enrolled:
              type: boolean
            confirmedAt:
              type: [string, 'null']
              format: date-time
        webauthn:
          type: array
          items:
            $ref: '#/components/schemas/WebauthnCredential'
        recoveryCodesRemaining:
          type: integer
          minimum: 0
          maximum: 10
        allowAppPasswords:
          type: boolean
    WebauthnCredential:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          description: base64url credential id.
        name:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastUsedAt:
          type: [string, 'null']
          format: date-time
    TotpEnrollment:
      type: object
      required: [secret, otpauthUrl]
      properties:
        secret:
          type: string
          description: Base32 seed for manual entry.
        otpauthUrl:
          type: string
          description: '`otpauth://totp/...` URI to render as a QR code.'
    TotpConfirmRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
    MfaEnrollmentResult:
      type: object
      required: [method]
      properties:
        method:
          $ref: '#/components/schemas/MfaMethod'
        credential:
          $ref: '#/components/schemas/WebauthnCredential'
        recoveryCodes:
          type: array
          description: Present only when this is the user's first MFA method. Shown once.
          items:
            type: string
    WebauthnRegistrationOptions:
      type: object
      description: '`PublicKeyCredentialCreationOptionsJSON` (WebAuthn L3), buffers base64url.'
      additionalProperties: true
      required: [challenge, rp, user, pubKeyCredParams]
      properties:
        challenge:
          type: string
        rp:
          type: object
          additionalProperties: true
        user:
          type: object
          additionalProperties: true
        pubKeyCredParams:
          type: array
          items:
            type: object
            additionalProperties: true
        timeout:
          type: integer
        excludeCredentials:
          type: array
          items:
            type: object
            additionalProperties: true
        authenticatorSelection:
          type: object
          additionalProperties: true
        attestation:
          type: string
    WebauthnRegistrationRequest:
      type: object
      required: [name, credential]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        credential:
          type: object
          description: '`RegistrationResponseJSON` from `navigator.credentials.create`.'
          additionalProperties: true
    RenameRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
    SessionInfo:
      type: object
      required: [id, createdAt, lastSeenAt, expiresAt, current]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastSeenAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        mfaAt:
          type: [string, 'null']
          format: date-time
        ip:
          type: [string, 'null']
        approxLocation:
          type: [string, 'null']
          description: City/country from IP, if a GeoIP database is configured.
        userAgent:
          type: [string, 'null']
        device:
          type: [string, 'null']
          description: Parsed device, e.g. `Mac`, `iPhone`.
        browser:
          type: [string, 'null']
          description: Parsed browser, e.g. `Firefox 131`.
        current:
          type: boolean
          description: True for the session making the request ("This device").
    SessionPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SessionInfo'
    AppPasswordScope:
      type: string
      enum: [imap, smtp, caldav]
    AppPassword:
      type: object
      required: [id, label, scopes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/AppPasswordScope'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastUsedAt:
          type: [string, 'null']
          format: date-time
    AppPasswordList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppPassword'
    AppPasswordCreateRequest:
      type: object
      required: [label, scopes]
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AppPasswordScope'
    AppPasswordCreated:
      type: object
      required: [appPassword, secret, clientSetup]
      properties:
        appPassword:
          $ref: '#/components/schemas/AppPassword'
        secret:
          type: string
          description: Shown exactly once; never retrievable again.
        clientSetup:
          $ref: '#/components/schemas/ClientSetupHints'
    ClientSetupHints:
      type: object
      description: Server names/ports for configuring mail and calendar clients.
      required: [username]
      properties:
        username:
          type: string
        imap:
          $ref: '#/components/schemas/ServerEndpoint'
        smtp:
          $ref: '#/components/schemas/ServerEndpoint'
        caldavUrl:
          type: [string, 'null']
    ServerEndpoint:
      type: [object, 'null']
      required: [host, port, security]
      properties:
        host:
          type: string
        port:
          type: integer
        security:
          type: string
          enum: [tls, starttls]
    ApiToken:
      type: object
      required: [id, name, scopes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        prefix:
          type: string
          description: First characters of the token for recognition, e.g. `sh_pat_ab12`.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          type: [string, 'null']
          format: date-time
        lastUsedAt:
          type: [string, 'null']
          format: date-time
    ApiTokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiToken'
    ApiTokenCreateRequest:
      type: object
      required: [name, scopes]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          description: OAuth-style scopes, e.g. `mail.read`, `calendar.write`.
          items:
            type: string
        expiresAt:
          type: [string, 'null']
          format: date-time
    ApiTokenCreated:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: '#/components/schemas/ApiToken'
        secret:
          type: string
          description: '`sh_pat_…`, shown exactly once.'
    ConnectedApp:
      type: object
      required: [clientId, name, scopes, grantedAt]
      properties:
        clientId:
          type: string
        name:
          type: string
        logoUrl:
          type: [string, 'null']
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopeDescription'
        grantedAt:
          $ref: '#/components/schemas/Timestamp'
        lastUsedAt:
          type: [string, 'null']
          format: date-time
    ConnectedAppList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedApp'

    # ------------------------------------------------------------ admin users
    RoleRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    AdminUser:
      type: object
      required: [id, orgId, email, displayName, locale, timeZone, status, isOrgOwner, roles, mfaEnabled, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: Primary address.
        displayName:
          type: string
        givenName:
          type: [string, 'null']
        familyName:
          type: [string, 'null']
        locale:
          type: string
        timeZone:
          type: string
        avatarUrl:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/UserStatus'
        statusReason:
          type: [string, 'null']
        isOrgOwner:
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRef'
        mfaEnabled:
          type: boolean
        lockedUntil:
          type: [string, 'null']
          format: date-time
        lastSignInAt:
          type: [string, 'null']
          format: date-time
        storageUsedBytes:
          type: [integer, 'null']
          format: int64
          description: From `mail.MailboxUsage` when mail is installed and reachable.
        purgeAfter:
          type: [string, 'null']
          format: date-time
          description: Set when `status = deleted`.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
    AdminUserPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminUser'
    InviteUserRequest:
      type: object
      required: [displayName, email, contactEmail]
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        givenName:
          type: string
          maxLength: 100
        familyName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          description: New primary address; domain must be verified in this org and the address free.
        contactEmail:
          type: string
          format: email
          description: External address the invitation is sent to.
        locale:
          type: string
        timeZone:
          type: string
        roleIds:
          type: array
          items:
            type: string
            format: uuid
        groupIds:
          type: array
          items:
            type: string
            format: uuid
    AdminUserPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        givenName:
          type: [string, 'null']
          maxLength: 100
        familyName:
          type: [string, 'null']
          maxLength: 100
        locale:
          type: string
        timeZone:
          type: string
        primaryAddressId:
          type: string
          format: uuid
          description: Promote one of the user's aliases to primary.
    SuspendUserRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    DeleteUserRequest:
      type: object
      additionalProperties: false
      properties:
        transferToUserId:
          type: [string, 'null']
          format: uuid
          description: Receives mail/calendar data ownership during the purge saga.
    AddressKind:
      type: string
      enum: [primary, alias, group]
    Address:
      type: object
      required: [id, address, kind, sendAs]
      properties:
        id:
          type: string
          format: uuid
        address:
          type: string
          format: email
        kind:
          $ref: '#/components/schemas/AddressKind'
        sendAs:
          type: boolean
    AddressList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Address'
    AddAliasRequest:
      type: object
      required: [address]
      additionalProperties: false
      properties:
        address:
          type: string
          format: email
        sendAs:
          type: boolean
          default: true

    # ------------------------------------------------------------ domains
    DomainStatus:
      type: string
      enum: [pending, verified, degraded, expired, removed]
    DnsRecord:
      type: object
      required: [type, name, value]
      properties:
        type:
          type: string
          enum: [TXT, MX, CNAME, SRV]
        name:
          type: string
          description: Fully qualified record name.
        value:
          type: string
        ttl:
          type: integer
    Domain:
      type: object
      required: [id, name, status, verificationRecord, failedChecks, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: IDNA-normalized (A-label) domain.
        unicodeName:
          type: string
          description: U-label form for display.
        status:
          $ref: '#/components/schemas/DomainStatus'
        statusReason:
          type: [string, 'null']
          enum: [claimed_elsewhere, verification_timeout, recheck_failed, null]
        verificationRecord:
          $ref: '#/components/schemas/DnsRecord'
        verifiedAt:
          type: [string, 'null']
          format: date-time
        lastCheck:
          type: [object, 'null']
          required: [checkedAt, result]
          properties:
            checkedAt:
              $ref: '#/components/schemas/Timestamp'
            result:
              type: string
              enum: [ok, not_found, mismatch, dns_error]
        failedChecks:
          type: integer
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: For `pending` domains — 7 days after creation.
        addressCount:
          type: integer
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    DomainList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
    AddDomainRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 253

    # ------------------------------------------------------------ groups
    WhoCanPost:
      type: string
      enum: [anyone, org, members]
    Group:
      type: object
      required: [id, name, whoCanPost, allowExternalMembers, memberCount, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: [string, 'null']
          format: email
          description: Distribution-list address, if any.
        description:
          type: [string, 'null']
        whoCanPost:
          $ref: '#/components/schemas/WhoCanPost'
        allowExternalMembers:
          type: boolean
        memberCount:
          type: integer
          description: Direct members.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
    GroupPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Group'
    GroupCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: [string, 'null']
          format: email
        description:
          type: [string, 'null']
          maxLength: 1000
        whoCanPost:
          $ref: '#/components/schemas/WhoCanPost'
        allowExternalMembers:
          type: boolean
          default: false
    GroupPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: [string, 'null']
          format: email
        description:
          type: [string, 'null']
          maxLength: 1000
        whoCanPost:
          $ref: '#/components/schemas/WhoCanPost'
        allowExternalMembers:
          type: boolean
    GroupMemberType:
      type: string
      enum: [user, group, external]
    GroupMember:
      type: object
      required: [id, type, displayName]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/GroupMemberType'
        userId:
          type: [string, 'null']
          format: uuid
        groupId:
          type: [string, 'null']
          format: uuid
        address:
          type: [string, 'null']
          format: email
          description: Primary address of the user/group, or the external address.
        displayName:
          type: string
        avatarUrl:
          type: [string, 'null']
        memberCount:
          type: [integer, 'null']
          description: For nested groups.
    GroupMemberPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/GroupMember'
    GroupMemberInput:
      type: object
      required: [type]
      additionalProperties: false
      description: '`user` → `userId`; `group` → `groupId`; `external` → `address`.'
      properties:
        type:
          $ref: '#/components/schemas/GroupMemberType'
        userId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        address:
          type: string
          format: email

    # ------------------------------------------------------------ roles
    BuiltinRole:
      type: string
      enum: [owner, admin, user_admin, helpdesk, member]
    Role:
      type: object
      required: [id, name, builtin, permissions, assignmentCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        builtin:
          type: boolean
        builtinKey:
          oneOf:
            - $ref: '#/components/schemas/BuiltinRole'
            - type: 'null'
        permissions:
          type: array
          items:
            type: string
        flaggedPermissions:
          type: array
          description: Permissions no longer in the catalog (flagged, not deleted).
          items:
            type: string
        assignmentCount:
          type: integer
    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    RoleInput:
      type: object
      required: [name, permissions]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 500
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
    RolePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 500
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
    PrincipalType:
      type: string
      enum: [user, group]
    RoleAssignment:
      type: object
      required: [id, roleId, roleName, principalType, principalId, principalDisplayName, scope]
      properties:
        id:
          type: string
          description: Opaque id (encodes role, principal and scope).
        roleId:
          type: string
          format: uuid
        roleName:
          type: string
        principalType:
          $ref: '#/components/schemas/PrincipalType'
        principalId:
          type: string
          format: uuid
        principalDisplayName:
          type: string
        principalEmail:
          type: [string, 'null']
        scope:
          type: string
          const: org
          description: v1 is always `org` (reserved for org units).
    RoleAssignmentPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RoleAssignment'
    RoleAssignmentInput:
      type: object
      required: [roleId, principalType, principalId]
      additionalProperties: false
      properties:
        roleId:
          type: string
          format: uuid
        principalType:
          $ref: '#/components/schemas/PrincipalType'
        principalId:
          type: string
          format: uuid
    Permission:
      type: object
      required: [name, serviceId, description, deprecated]
      properties:
        name:
          type: string
          examples: [mail.admin.queue.read]
        serviceId:
          type: string
        description:
          type: string
        deprecated:
          type: boolean
    PermissionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    # ------------------------------------------------------------ org
    OrgSlug:
      type: string
      pattern: '^[a-z0-9-]{3,40}$'
    Organization:
      type: object
      required: [id, name, slug, status, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          $ref: '#/components/schemas/OrgSlug'
        status:
          type: string
          enum: [active, suspended]
        logoUrl:
          type: [string, 'null']
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
    OrganizationPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          $ref: '#/components/schemas/OrgSlug'
    MfaRequirement:
      type: string
      enum: [none, admins, all]
    OrgPolicy:
      type: object
      required: [mfaRequired, passwordMinLength, sessionMaxAgeSeconds, sessionIdleTimeoutSeconds, allowAppPasswords, allowedIdPs, deletedUserRetentionDays, suspendedUserInbound, version]
      properties:
        mfaRequired:
          $ref: '#/components/schemas/MfaRequirement'
        mfaEnforcedFrom:
          type: [string, 'null']
          format: date-time
          description: Enforcement date for a newly tightened MFA requirement (users enroll before it).
        passwordMinLength:
          type: integer
          minimum: 12
          maximum: 128
        sessionMaxAgeSeconds:
          type: integer
          minimum: 3600
        sessionIdleTimeoutSeconds:
          type: integer
          minimum: 300
        allowAppPasswords:
          type: boolean
        allowedIdPs:
          type: array
          items:
            type: string
        deletedUserRetentionDays:
          type: integer
          minimum: 0
          maximum: 3650
          default: 30
        suspendedUserInbound:
          type: string
          enum: [accept, reject]
        version:
          type: integer
    OrgPolicyPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        mfaRequired:
          $ref: '#/components/schemas/MfaRequirement'
        mfaEnforcedFrom:
          type: [string, 'null']
          format: date-time
        passwordMinLength:
          type: integer
          minimum: 12
          maximum: 128
        sessionMaxAgeSeconds:
          type: integer
          minimum: 3600
        sessionIdleTimeoutSeconds:
          type: integer
          minimum: 300
        allowAppPasswords:
          type: boolean
        allowedIdPs:
          type: array
          items:
            type: string
        deletedUserRetentionDays:
          type: integer
          minimum: 0
          maximum: 3650
        suspendedUserInbound:
          type: string
          enum: [accept, reject]
    ServiceHealth:
      type: string
      enum: [healthy, degraded, down, unknown]
    RegisteredService:
      type: object
      required: [id, displayName, baseUrl, status, health]
      properties:
        id:
          type: string
          examples: [mail]
        displayName:
          type: string
        baseUrl:
          type: string
        icon:
          type: [string, 'null']
        status:
          type: string
          enum: [active, disabled]
        version:
          type: [string, 'null']
        health:
          $ref: '#/components/schemas/ServiceHealth'
        healthCheckedAt:
          type: [string, 'null']
          format: date-time
        adminModuleUrl:
          type: [string, 'null']
          description: ES module URL of the app's admin console section (lazy-loaded), if it contributes one.
        registeredAt:
          $ref: '#/components/schemas/Timestamp'
    ServiceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RegisteredService'

    # ------------------------------------------------------------ audit
    AuditOutcome:
      type: string
      enum: [success, failure, denied]
    AuditEntry:
      type: object
      required: [id, occurredAt, service, action, actor, outcome]
      properties:
        id:
          type: string
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        service:
          type: string
        action:
          type: string
          examples: [auth.user.suspend]
        actor:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
              enum: [user, service, system, anonymous]
            id:
              type: string
            displayName:
              type: [string, 'null']
        target:
          type: [object, 'null']
          required: [type, id]
          properties:
            type:
              type: string
            id:
              type: string
            displayName:
              type: [string, 'null']
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        ip:
          type: [string, 'null']
        userAgent:
          type: [string, 'null']
        requestId:
          type: [string, 'null']
        details:
          type: object
          additionalProperties: true
    AuditPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuditEntry'

    # ------------------------------------------------------------ OIDC
    OidcProviderMetadata:
      type: object
      additionalProperties: true
      required: [issuer, authorization_endpoint, token_endpoint, jwks_uri]
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        userinfo_endpoint:
          type: string
        revocation_endpoint:
          type: string
        introspection_endpoint:
          type: string
        end_session_endpoint:
          type: string
        jwks_uri:
          type: string
        scopes_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [kty, kid]
            properties:
              kty:
                type: string
              kid:
                type: string
              alg:
                type: string
              use:
                type: string
              crv:
                type: string
              x:
                type: string
              y:
                type: string
    OidcTokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [authorization_code, refresh_token, client_credentials]
        code:
          type: string
        redirect_uri:
          type: string
        code_verifier:
          type: string
        refresh_token:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        scope:
          type: string
        audience:
          type: string
          description: Space-separated target services (client_credentials).
    OidcTokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
        refresh_token:
          type: string
        id_token:
          type: string
        scope:
          type: string
    OidcRevokeRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
        token_type_hint:
          type: string
          enum: [access_token, refresh_token]
        client_id:
          type: string
        client_secret:
          type: string
    OidcIntrospectRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
        token_type_hint:
          type: string
          enum: [access_token, refresh_token]
    OidcIntrospection:
      type: object
      required: [active]
      additionalProperties: true
      properties:
        active:
          type: boolean
        sub:
          type: string
        aud:
          type: array
          items:
            type: string
        scope:
          type: string
        exp:
          type: integer
        iat:
          type: integer
        client_id:
          type: string
        org:
          type: string
        sid:
          type: string
    OidcUserInfo:
      type: object
      required: [sub]
      additionalProperties: true
      properties:
        sub:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        locale:
          type: string
        zoneinfo:
          type: string
        picture:
          type: string
        org:
          type: string
    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_grant, unauthorized_client, unsupported_grant_type, invalid_scope, access_denied, server_error]
        error_description:
          type: string
