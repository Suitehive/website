    post:
      tags: [import]
      operationId: startImport
      summary: Import from Jira (XML/CSV export), Notion (Markdown/HTML zip), Plane (JSON), Linear (CSV) or generic CSV; runs as a job.
      parameters:
        - $ref: '#/components/parameters/Ws'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [source, file]
              properties:
                source:
                  $ref: '#/components/schemas/ImportSource'
                projectId:
                  type: string
                  format: uuid
                  description: Target project for work items (omit to create projects from the export). Ignored for Notion.
                file:
                  type: string
                  format: binary
                  description: The export file (≤ 200 MB).
      responses:
        '202':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
