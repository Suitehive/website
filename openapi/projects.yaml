openapi: 3.1.0
info:
  title: Suitehive Projects API
  version: 0.1.0
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  description: |
    Public REST API of the **Projects** service (work tracking + docs). Source of truth for the UI:
    `docs/design/11-ui-projects.md`; backend plan: `projects/ARCHITECTURE.md`.

    ## Conventions
    - All paths are under `/api/projects`. JSON, `camelCase`, UUIDv7 ids. Workspaces are addressed by `slug`.
    - Auth: `Authorization: Bearer <jwt>` whose `aud` includes `projects`. The tenant is the Auth org; workspaces live inside it.
    - Cursor pagination `?limit=&cursor=` → `{ items, nextCursor }`.
    - Errors: RFC 9457 `application/problem+json` with stable `code` (see `ErrorCode`) and `fields`.
    - Concurrency: mutable resources carry `version` and `ETag: "<version>"`. `PATCH` accepts `If-Match` (enforced when sent);
      `PUT /pages/{id}/content` **requires** it → `412` on a stale version.
    - Creates accept `Idempotency-Key` (replays return the first response for 24 h).
    - Dates without time (`startDate`, `dueDate`, cycle and module dates) are plain ISO dates (`2026-10-13`), never shifted by time zone.
    - Array query parameters are comma-separated (`?state=a,b`). `assignee` accepts user ids plus `me` and `none`;
      `label`, `cycle`, `module` accept `none` ("no label/cycle/module").

    ## Work item keys
    `key` = `<project identifier>-<sequenceId>` (`WEB-123`). Sequences are per project and never reused. After an identifier change,
    `GET /workspaces/{ws}/work-items/{key}` still resolves old keys.

    ## Ordering
    `sortOrder` is a fractional rank (float64). Moving an item between two neighbours sets `sortOrder` to the midpoint; the server
    rebalances a project's ranks in the background when gaps get too small and emits `work_item` changes.

    ## Page content
    Page content (and work item descriptions as blocks, later) is a **block document**: ProseMirror-compatible JSON
    (`{"type":"doc","content":[…]}`) — see `BlockDoc` and `BlockType`. The server stores one row per top-level block for search,
    embeds and comments anchors, and validates node types and nesting.
servers:
  - url: /
    description: Same origin as the gateway (paths are absolute).
tags:
  - name: me
    description: The caller's workspaces and settings.
  - name: workspaces
    description: Workspaces, members, favorites, recents.
  - name: projects
    description: Projects and project members.
  - name: workflow
    description: Workflow states and labels.
  - name: workitems
    description: Work items, sub-items, relations, links, subscriptions, batch edits.
  - name: collaboration
    description: Comments, reactions, activity, attachments.
  - name: cycles
    description: Cycles (sprints) and burndown.
  - name: modules
    description: Modules (epics).
  - name: views
    description: Saved views.
  - name: pages
    description: Pages, wiki, block content, versions, sharing, publishing, templates.
  - name: notifications
    description: Inbox.
  - name: insights
    description: Search and analytics.
  - name: import
    description: Import from Jira, Notion, Plane, Linear, CSV.
  - name: sync
    description: Delta API and SSE change feed.
  - name: integrations
    description: GitHub App integration (installation, repositories, automation, development info, webhook receiver).
security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- me
  /api/projects/me:
    get:
      tags: [me]
      operationId: getMe
      summary: The caller's workspaces (with their role) and settings. First call of the web app.
      responses:
        '200':
          description: Caller context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects/me/settings:
    get:
      tags: [me]
      operationId: getSettings
      summary: Per-user settings.
      responses:
        '200':
          description: Settings.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [me]
      operationId: putSettings
      summary: Replace per-user settings.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsInput'
      responses:
        '200':
          description: Updated.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  # ---------------------------------------------------------------- workspaces
  /api/projects/workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: Workspaces the caller belongs to.
      responses:
        '200':
          description: Workspaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Create a workspace; the caller becomes its owner.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceInput'
      responses:
        '201':
          description: Created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/projects/workspaces/{ws}:
    get:
      tags: [workspaces]
      operationId: getWorkspace
      summary: Get a workspace.
      parameters:
        - $ref: '#/components/parameters/Ws'
      responses:
        '200':
          description: Workspace.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [workspaces]
      operationId: updateWorkspace
      summary: Rename, recolor or change the slug (admin).
      parameters:
        - $ref: '#/components/parameters/Ws'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspacePatch'
      responses:
        '200':
          description: Updated.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      tags: [workspaces]
      operationId: deleteWorkspace
      summary: Delete a workspace and everything in it (owner; asynchronous purge).
      parameters:
        - $ref: '#/components/parameters/Ws'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/projects/workspaces/{ws}/members:
    get:
      tags: [workspaces]
      operationId: listMembers
      summary: Workspace members (directory read-model joined with workspace roles).
      parameters:
        - $ref: '#/components/parameters/Ws'
        - name: q
          in: query
          description: Name or email prefix.
          schema:
            type: string
            maxLength: 200
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/workspaces/{ws}/members:invite:
    post:
      tags: [workspaces]
      operationId: inviteMembers
      summary: Add org users to the workspace by email (admin). Unknown emails are reported, not created (accounts live in Auth).
      parameters:
        - $ref: '#/components/parameters/Ws'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInvite'
      responses:
        '200':
          description: Result per email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/projects/workspaces/{ws}/members/{userId}:
    patch:
      tags: [workspaces]
      operationId: updateMember
      summary: Change a member's workspace role (admin). The last owner cannot be demoted.
      parameters:
        - $ref: '#/components/parameters/Ws'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberPatch'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [workspaces]
      operationId: removeMember
      summary: Remove a member (admin), or leave (self). Their items stay; assignments are kept for history.
      parameters:
        - $ref: '#/components/parameters/Ws'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/projects/workspaces/{ws}/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: Projects visible to the caller (public projects of the workspace + private ones they are a member of).
      parameters:
        - $ref: '#/components/parameters/Ws'
        - $ref: '#/components/parameters/Archived'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Projects (favorites first, then `sortOrder`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project with a starter workflow and labels; the caller becomes project admin.
      parameters:
        - $ref: '#/components/parameters/Ws'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/projects/workspaces/{ws}/work-items:
    get:
      tags: [workitems]
      operationId: listWorkspaceWorkItems
      summary: Work items across the caller's projects (My work, workspace views).
      parameters:
        - $ref: '#/components/parameters/Ws'
        - $ref: '#/components/parameters/FilterProject'
        - $ref: '#/components/parameters/FilterState'
        - $ref: '#/components/parameters/FilterStateGroup'
        - $ref: '#/components/parameters/FilterPriority'
        - $ref: '#/components/parameters/FilterAssignee'
        - $ref: '#/components/parameters/FilterLabel'
        - $ref: '#/components/parameters/FilterCycle'
        - $ref: '#/components/parameters/FilterModule'
        - $ref: '#/components/parameters/FilterType'
        - $ref: '#/components/parameters/FilterCreatedBy'
        - $ref: '#/components/parameters/FilterDue'
        - $ref: '#/components/parameters/FilterDueFrom'
        - $ref: '#/components/parameters/FilterDueTo'
        - $ref: '#/components/parameters/FilterStartFrom'
        - $ref: '#/components/parameters/FilterStartTo'
        - $ref: '#/components/parameters/FilterParent'
        - $ref: '#/components/parameters/FilterSubscribed'
        - $ref: '#/components/parameters/FilterPullRequest'
        - $ref: '#/components/parameters/FilterQ'
        - $ref: '#/components/parameters/Archived'
        - $ref: '#/components/parameters/OrderBy'
        - $ref: '#/components/parameters/OrderDirection'
        - $ref: '#/components/parameters/ApplyView'
        - $ref: '#/components/parameters/ItemLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of work items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/workspaces/{ws}/activity:
    get:
      tags: [collaboration]
      operationId: listWorkspaceActivity
      summary: Activity feed across the workspace (My work → Activity uses `actor=me`).
      parameters:
        - $ref: '#/components/parameters/Ws'
        - name: actor
          in: query
          description: A user id or `me`.
          schema:
            type: string
        - $ref: '#/components/parameters/FilterProject'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Activity, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects/workspaces/{ws}/views:
    get:
      tags: [views]
      operationId: listWorkspaceViews
      summary: Workspace-level (cross-project) saved views visible to the caller.
      parameters:
        - $ref: '#/components/parameters/Ws'
      responses:
        '200':
          description: Views.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [views]
      operationId: createWorkspaceView
      summary: Create a workspace-level saved view.
      parameters:
        - $ref: '#/components/parameters/Ws'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects/workspaces/{ws}/labels:
    get:
      tags: [workflow]
      operationId: listWorkspaceLabels
      summary: Workspace-wide labels (usable in every project).
      parameters:
        - $ref: '#/components/parameters/Ws'
      responses:
        '200':
          description: Labels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [workflow]
      operationId: createWorkspaceLabel
      summary: Create a workspace label (admin).
      parameters:
        - $ref: '#/components/parameters/Ws'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/projects/workspaces/{ws}/pages:
    get:
      tags: [pages]
      operationId: listWikiPages
      summary: Wiki pages (workspace tree, `projectId = null`) as a flat list; the client builds the tree from `parentId`.
      parameters:
        - $ref: '#/components/parameters/Ws'
        - $ref: '#/components/parameters/Archived'
      responses:
        '200':
          description: Pages (metadata only, no content).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [pages]
      operationId: createWikiPage
      summary: Create a wiki page (optionally from a template).
      parameters:
        - $ref: '#/components/parameters/Ws'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageInput'
      responses:
        '201':
          description: Created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects/workspaces/{ws}/page-templates:
    get:
      tags: [pages]
      operationId: listPageTemplates
      summary: Built-in and workspace page templates.
      parameters:
        - $ref: '#/components/parameters/Ws'
      responses:
        '200':
          description: Templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTemplateList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [pages]
      operationId: createPageTemplate
      summary: Create a workspace template.
      parameters:
        - $ref: '#/components/parameters/Ws'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageTemplateInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects/workspaces/{ws}/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: The caller's inbox, newest first.
      parameters:
        - $ref: '#/components/parameters/Ws'
        - name: filter
          in: query
          schema:
            $ref: '#/components/schemas/NotificationFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects/workspaces/{ws}/notifications:markAllRead:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: Mark every notification (optionally of one project, up to a time) as read.
      parameters:
        - $ref: '#/components/parameters/Ws'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkAllRead'
      responses:
        '204':
          description: Done.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects/workspaces/{ws}/search:
    get:
      tags: [insights]
      operationId: search
      summary: Search work items (key or text), pages (title + content), projects, cycles, modules, views and people.
      parameters:
        - $ref: '#/components/parameters/Ws'
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 500
        - name: types
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SearchHitKind'
        - $ref: '#/components/parameters/FilterProject'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Ranked hits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects/workspaces/{ws}/analytics:
    get:
      tags: [insights]
      operationId: getAnalytics
      summary: Custom analytics — `x` dimension × `y` metric, optionally segmented.
      parameters:
        - $ref: '#/components/parameters/Ws'
        - name: x
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/AnalyticsDimension'
        - name: y
          in: query
          schema:
            $ref: '#/components/schemas/AnalyticsMetric'
        - name: segment
          in: query
          schema:
            $ref: '#/components/schemas/AnalyticsDimension'
        - $ref: '#/components/parameters/FilterProject'
        - $ref: '#/components/parameters/FilterCycle'
        - $ref: '#/components/parameters/FilterModule'
      responses:
        '200':
          description: Rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects/workspaces/{ws}/analytics/overview:
    get:
      tags: [insights]
      operationId: getAnalyticsOverview
      summary: Overview numbers and charts (workspace, or one project with `project=`).
      parameters:
        - $ref: '#/components/parameters/Ws'
        - $ref: '#/components/parameters/FilterProject'
      responses:
        '200':
          description: Overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects/workspaces/{ws}/favorites:
    get:
      tags: [workspaces]
      operationId: listFavorites
      summary: The caller's favorites (sidebar FAVORITES section).
      parameters:
        - $ref: '#/components/parameters/Ws'
      responses:
        '200':
          description: Favorites in the caller's order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [workspaces]
      operationId: addFavorite
      summary: Favorite a project, view, cycle, module or page (idempotent).
      parameters:
        - $ref: '#/components/parameters/Ws'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteInput'
      responses:
        '200':
          description: Favorites after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/workspaces/{ws}/favorites/{kind}/{id}:
    delete:
      tags: [workspaces]
      operationId: removeFavorite
      summary: Unfavorite (idempotent).
      parameters:
        - $ref: '#/components/parameters/Ws'
        - name: kind
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/FavoriteKind'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed.
        '401':
