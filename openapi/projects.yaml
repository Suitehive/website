          description: Uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/projects/page-templates/{id}:
    patch:
      tags: [pages]
      operationId: updatePageTemplate
      summary: Update a workspace template (built-in templates are read-only).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageTemplatePatch'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [pages]
      operationId: deletePageTemplate
      summary: Delete a workspace template.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- notifications
  /api/projects/notifications/{id}:
    patch:
      tags: [notifications]
      operationId: updateNotification
      summary: Mark read/unread, archive/unarchive, snooze/unsnooze.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPatch'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- sync
  /api/projects/changes:
    get:
      tags: [sync]
      operationId: getChanges
      summary: Change log since a sequence number, for entities the caller can read.
      description: |
        Oldest first, up to `limit`. When `hasMore`, call again with `since = cursor`. `since` older than the
        30-day retention → `410 common.cursor_expired` (refetch visible screens).
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: ws
          in: query
          description: Restrict to one workspace (slug).
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        '200':
          description: Delta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          $ref: '#/components/responses/CursorExpired'

  /api/projects/events:
    get:
      tags: [sync]
      operationId: streamEvents
      summary: Server-Sent Events change feed (entity changes, notifications, session revocation).
      description: |
        `text/event-stream`, heartbeat every 25 s, resume with `Last-Event-ID`. Event types:
        ```
        id: <seq>
        event: projects
        data: {"topic":"projects","cursor":"812","workspaceId":"…","projectId":"…"}

        event: notifications
        data: {"topic":"notifications","cursor":"0","unreadCount":4}

        event: session
        data: {"topic":"session","cursor":"0","reason":"revoked"}
        ```
        Data never carries entity content; fetch it over REST (authorization stays in one place).
      parameters:
        - $ref: '#/components/parameters/LastEventId'
        - name: access_token
          in: query
          description: Bearer token for clients that cannot send `Authorization` (EventSource).
          schema:
            type: string
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE stream; each `data:` line is a `RealtimeNotification` JSON object.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ---------------------------------------------------------------- integrations: GitHub
  /api/projects/workspaces/{ws}/integrations/github:
    get:
      tags: [integrations]
      operationId: getGitHubInstallation
      summary: The workspace's GitHub App installation (or `status=not_installed`) with connection health.
      description: Readable by every workspace member (the Integrations page and the Development section need it); only owners/admins see `health.recentErrors`.
      parameters:
        - $ref: '#/components/parameters/Ws'
      responses:
        '200':
          description: Installation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubInstallation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [integrations]
      operationId: disconnectGitHub
      summary: Disconnect GitHub (admins). Uninstalls the app via the GitHub API, drops installation tokens and repo links; PR/branch/commit history on work items is kept read-only.
      parameters:
        - $ref: '#/components/parameters/Ws'
      responses:
        '204':
          description: Disconnected.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/workspaces/{ws}/integrations/github:connect:
    post:
      tags: [integrations]
      operationId: startGitHubConnect
      summary: Start the GitHub App install flow (admins). Returns the github.com install URL with a signed, single-use `state` (10 min).
      description: |
        The browser navigates to `url`. GitHub redirects back to the app's Setup URL
        (`/projects/{ws}/settings/integrations?installation_id=…&setup_action=install&state=…`), and the web app
        then calls `completeGitHubConnect`.
      parameters:
        - $ref: '#/components/parameters/Ws'
      responses:
        '200':
          description: Install URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubConnectUrl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/projects/workspaces/{ws}/integrations/github:complete:
    post:
      tags: [integrations]
      operationId: completeGitHubConnect
      summary: Finish the install (admins) — verifies `state`, fetches the installation with an app JWT, stores it and syncs the repository list.
      parameters:
        - $ref: '#/components/parameters/Ws'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubConnectComplete'
      responses:
        '200':
          description: Installed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubInstallation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/projects/workspaces/{ws}/integrations/github/repositories:
    get:
      tags: [integrations]
      operationId: listGitHubRepositories
      summary: Repositories the installation can access (cached mirror, refreshed by webhooks and `syncGitHubRepositories`).
      parameters:
        - $ref: '#/components/parameters/Ws'
        - name: q
          in: query
          description: Substring of `fullName`.
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Repositories, most recently pushed first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GitHubRepository'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/workspaces/{ws}/integrations/github/repositories:sync:
    post:
      tags: [integrations]
      operationId: syncGitHubRepositories
      summary: Re-read the installation's repositories from GitHub now (admins; rate limited to once a minute).
      parameters:
        - $ref: '#/components/parameters/Ws'
      responses:
        '200':
          description: The refreshed list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GitHubRepository'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/projects/projects/{id}/integrations/github/repositories:
    get:
      tags: [integrations]
      operationId: listProjectRepositories
      summary: Repositories linked to this project.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Links.
          content:
            application/json:
