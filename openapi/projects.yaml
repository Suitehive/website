              $ref: '#/components/schemas/CommentInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects/pages/{id}/attachments:
    post:
      tags: [collaboration]
      operationId: uploadPageAttachment
      summary: Upload an image or file for an image/file block (≤ 100 MB).
      parameters:
