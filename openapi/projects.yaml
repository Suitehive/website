      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkPullRequestInput'
      responses:
        '201':
          description: Linked (fetched from GitHub on the spot).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/projects/work-items/{id}/development/pull-requests/{prId}:
    delete:
      tags: [integrations]
      operationId: unlinkPullRequest
      summary: Unlink a pull request from this work item (manual and parsed links alike; a parsed link is not re-added by later events).
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: prId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Unlinked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/work-items/{id}/development/branch-name:
    get:
      tags: [integrations]
      operationId: getBranchName
      summary: Suggested branch name (`web-123-pricing-table-collapses`) and the matching `git checkout -b` command.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Suggestion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchNameSuggestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/integrations/github/webhook:
    post:
      tags: [integrations]
      operationId: receiveGitHubWebhook
      summary: GitHub App webhook receiver (server-to-server; never called by the web app).
      description: |
        Authenticated by `X-Hub-Signature-256` (HMAC-SHA256 of the raw body with the app's webhook secret,
        constant-time compare), not by a bearer token. Deduplicated by `X-GitHub-Delivery` (the GUID is stored in
        `webhook_deliveries`; a replay answers `200` without side effects). The body is persisted and handled by a
        `kit/jobs` worker, so the endpoint answers within GitHub's 10 s budget. Handled events: `installation`,
        `installation_repositories`, `pull_request`, `pull_request_review`, `push`, `create`, `delete`, `issues`,
        `issue_comment`, `check_suite`, `check_run`. Others are acknowledged and ignored.
      security: []
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: '`sha256=<hex hmac>`.'
          schema:
            type: string
        - name: X-GitHub-Hook-Installation-Target-ID
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The GitHub event payload, verbatim (see GitHub's webhook docs).
              additionalProperties: true
      responses:
        '200':
          description: Duplicate delivery (already processed).
        '202':
          description: Accepted for processing.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Bad or missing signature (`projects.github.signature_invalid`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ES256 access token from Auth; `aud` must include `projects`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Ws:
      name: ws
      in: path
      required: true
      description: Workspace slug.
      schema:
        $ref: '#/components/schemas/WorkspaceSlug'
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`.
      schema:
        type: string
        maxLength: 1024
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ItemLimit:
      name: limit
      in: query
      description: Work item pages are larger (the UI loads whole scopes up to 2,000 items).
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
    Archived:
      name: archived
      in: query
      description: '`true` returns only archived entities (Archives screen); default excludes them.'
      schema:
        type: boolean
        default: false
    FilterProject:
      name: project
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    FilterState:
      name: state
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
    FilterStateGroup:
      name: stateGroup
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/StateGroup'
    FilterPriority:
      name: priority
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Priority'
    FilterAssignee:
      name: assignee
      in: query
      style: form
      explode: false
      description: User ids, `me`, or `none` (unassigned).
      schema:
        type: array
        items:
          type: string
    FilterLabel:
      name: label
      in: query
      style: form
      explode: false
      description: Label ids or `none`.
      schema:
        type: array
        items:
          type: string
    FilterCycle:
      name: cycle
      in: query
      style: form
      explode: false
      description: Cycle ids, `active`, or `none`.
      schema:
        type: array
        items:
          type: string
    FilterModule:
      name: module
      in: query
      style: form
      explode: false
      description: Module ids or `none`.
      schema:
        type: array
        items:
          type: string
    FilterType:
      name: type
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/WorkItemType'
    FilterCreatedBy:
      name: createdBy
      in: query
      style: form
      explode: false
      description: User ids or `me`.
      schema:
        type: array
        items:
          type: string
    FilterDue:
      name: due
      in: query
      schema:
        $ref: '#/components/schemas/DatePreset'
    FilterDueFrom:
      name: dueFrom
      in: query
      schema:
        $ref: '#/components/schemas/PlainDate'
    FilterDueTo:
      name: dueTo
      in: query
      schema:
        $ref: '#/components/schemas/PlainDate'
    FilterStartFrom:
      name: startFrom
      in: query
      schema:
        $ref: '#/components/schemas/PlainDate'
    FilterStartTo:
      name: startTo
      in: query
      schema:
        $ref: '#/components/schemas/PlainDate'
    FilterParent:
      name: parent
      in: query
      description: A work item id (its direct children), or `none` (top-level items only).
      schema:
        type: string
    FilterSubscribed:
      name: subscribed
      in: query
      description: Only items the caller is subscribed to.
      schema:
        type: boolean
    FilterPullRequest:
      name: pr
      in: query
      description: Pull request state of linked PRs (`open`, `draft`, `merged`, `none`), OR within.
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/PullRequestFilter'
    FilterQ:
      name: q
      in: query
      description: Text in title/description, or a key (`WEB-12`).
      schema:
        type: string
        maxLength: 500
    OrderBy:
      name: orderBy
      in: query
      schema:
        $ref: '#/components/schemas/OrderBy'
    OrderDirection:
      name: order
      in: query
      schema:
        $ref: '#/components/schemas/OrderDirection'
    ApplyView:
      name: view
      in: query
      description: Apply a saved view's filters server-side (explicit filter params override it).
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      description: '`"<version>"`; optional here, enforced when sent.'
      schema:
        type: string
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: '`"<version>"` from the resource''s `ETag`.'
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-generated unique key; replays return the first response for 24 h.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    LastEventId:
      name: Last-Event-ID
      in: header
      schema:
        type: string

  headers:
    ETag:
      description: '`"<version>"` of the returned resource.'
      schema:
        type: string
    Location:
      description: URL of the created resource.
      schema:
        type: string
    RetryAfter:
      description: Seconds until retry.
      schema:
        type: integer

  responses:
    BadRequest:
      description: Malformed request or validation failure (`common.validation_failed` with `fields`, or a `projects.*` code).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing/invalid/expired token (`common.unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Insufficient role (`common.forbidden`, `projects.project.archived`, `projects.page.locked`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found (also ids of other tenants and private projects/pages without access).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict; see `code`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: Stale `If-Match` (`common.precondition_failed`) — reload the resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: '`If-Match` missing (`common.precondition_required`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyMismatch:
      description: Same `Idempotency-Key` with a different body (`common.idempotency_key_reused`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Too large (`common.payload_too_large`, `projects.page.content_too_large`, `projects.import.too_large`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CursorExpired:
      description: '`since` older than retention (`common.cursor_expired`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limited (`common.rate_limited`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ------------------------------------------------------------ common
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable code; see `ErrorCode`.
          examples: [projects.project.identifier_taken]
        fields:
          type: object
          description: 'Validation details: field name (JSON pointer for nested fields) to reason code.'
          additionalProperties:
            type: string
        requestId:
          type: string
        retryAfterSeconds:
          type: integer
    ErrorCode:
      type: string
      description: Known `Problem.code` values for this service (common + projects).
      enum:
        - common.invalid_json
        - common.validation_failed
        - common.unauthenticated
        - common.forbidden
        - common.not_found
        - common.conflict
        - common.precondition_failed
        - common.precondition_required
        - common.idempotency_key_required
        - common.idempotency_key_reused
        - common.rate_limited
        - common.payload_too_large
        - common.unsupported_media_type
        - common.cursor_expired
        - common.internal
        - common.unavailable
        - projects.workspace.slug_taken
        - projects.workspace.last_owner
        - projects.member.not_in_org
        - projects.member.last_admin
        - projects.project.identifier_taken
        - projects.project.identifier_invalid
        - projects.project.archived
        - projects.project.not_archived
        - projects.project.feature_disabled
        - projects.state.in_use
        - projects.state.default_undeletable
        - projects.state.last_in_group
        - projects.state.group_locked
        - projects.label.name_taken
        - projects.work_item.invalid_dates
        - projects.work_item.parent_cycle
        - projects.work_item.cross_project_parent
        - projects.work_item.not_archivable
        - projects.work_item.invalid_estimate
        - projects.work_item.assignee_not_member
        - projects.relation.self
        - projects.relation.exists
        - projects.cycle.overlap
        - projects.cycle.invalid_dates
        - projects.cycle.completed
        - projects.cycle.not_active
        - projects.module.invalid_dates
        - projects.view.invalid_filter
        - projects.page.circular_move
        - projects.page.locked
        - projects.page.invalid_content
        - projects.page.content_too_large
        - projects.template.built_in
        - projects.import.unsupported_source
        - projects.import.too_large
        - projects.import.invalid_file
        - projects.attachment.too_large
        - projects.github.not_installed
        - projects.github.already_installed
        - projects.github.state_invalid
        - projects.github.repo_not_accessible
        - projects.github.repo_already_linked
        - projects.github.pr_url_invalid
        - projects.github.pr_not_found
        - projects.github.pr_already_linked
        - projects.github.signature_invalid
        - projects.github.rate_limited
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC.
    PlainDate:
      type: string
      format: date
      description: ISO calendar date without time zone (`2026-10-13`).
    Pastel:
      type: string
      description: The 07 §2 pastel palette names.
      enum: [indigo, sky, blue, mint, butter, amber, peach, coral, rose, lavender, lime, slate]
    WorkspaceSlug:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,47}$'
    RealtimeNotification:
      type: object
      description: SSE payload — "something changed" + cursor, never content.
      required: [topic, cursor]
      properties:
        topic:
          type: string
          enum: [projects, notifications, session]
        cursor:
          type: string
          description: Change-log sequence (decimal string) for `projects`.
        workspaceId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        unreadCount:
          type: integer
          description: For `notifications`.
        reason:
          type: string
          description: For `session` (`revoked`).
    ItemIds:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid

    # ------------------------------------------------------------ me / workspaces / members
    MemberRole:
      type: string
      description: Workspace role. `guest` sees only projects they are added to and cannot see the wiki.
      enum: [owner, admin, member, guest]
    Workspace:
      type: object
      required: [id, slug, name, color, role, memberCount, projectCount, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        slug:
          $ref: '#/components/schemas/WorkspaceSlug'
        name:
          type: string
        color:
          $ref: '#/components/schemas/Pastel'
        logoUrl:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/MemberRole'
        memberCount:
          type: integer
        projectCount:
          type: integer
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
    WorkspaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
    WorkspaceInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          $ref: '#/components/schemas/WorkspaceSlug'
        color:
          $ref: '#/components/schemas/Pastel'
    WorkspacePatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          $ref: '#/components/schemas/WorkspaceSlug'
        color:
          $ref: '#/components/schemas/Pastel'
    Member:
      type: object
      required: [userId, name, email, role, joinedAt, active]
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type: [string, 'null']
        title:
          type: [string, 'null']
          description: Job title from the directory.
        role:
          $ref: '#/components/schemas/MemberRole'
        joinedAt:
          $ref: '#/components/schemas/Timestamp'
        active:
          type: boolean
          description: False when the user is suspended or removed in Auth (kept for history).
    MemberPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        nextCursor:
          type: [string, 'null']
    MemberInvite:
      type: object
      required: [emails, role]
      properties:
        emails:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: email
        role:
          $ref: '#/components/schemas/MemberRole'
    InviteResult:
      type: object
      required: [added, skipped]
      properties:
        added:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        skipped:
          type: array
          items:
            type: object
            required: [email, reason]
            properties:
              email:
                type: string
              reason:
                type: string
                enum: [already_member, not_in_org, invalid]
    MemberPatch:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/MemberRole'
    LayoutKind:
      type: string
      enum: [list, board, spreadsheet, calendar, timeline]
    StartPage:
      type: string
      enum: [home, my_work, inbox]
    EmailNotificationPrefs:
      type: object
      required: [assigned, mentioned, comments, stateChanges, digest]
      properties:
        assigned:
          type: boolean
        mentioned:
          type: boolean
        comments:
          type: boolean
        stateChanges:
          type: boolean
        digest:
          type: string
          enum: [off, daily, weekly]
    UserSettingsInput:
      type: object
      required: [keyboardShortcuts, startPage, defaultLayout, weekStart, email]
      properties:
        keyboardShortcuts:
          type: boolean
        startPage:
          $ref: '#/components/schemas/StartPage'
        defaultLayout:
          $ref: '#/components/schemas/LayoutKind'
        weekStart:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO weekday (1 = Monday).
        lastWorkspaceSlug:
          type: [string, 'null']
        email:
          $ref: '#/components/schemas/EmailNotificationPrefs'
    UserSettings:
      allOf:
        - $ref: '#/components/schemas/UserSettingsInput'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
    MeResponse:
      type: object
      required: [userId, workspaces, settings]
      properties:
        userId:
          type: string
          format: uuid
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        settings:
          $ref: '#/components/schemas/UserSettings'

    # ------------------------------------------------------------ projects
    ProjectRole:
      type: string
      enum: [admin, member, viewer]
    ProjectVisibility:
      type: string
      description: '`public`: every workspace member can see and join; `private`: members only.'
      enum: [public, private]
    ProjectIdentifier:
      type: string
      pattern: '^[A-Z][A-Z0-9]{1,4}$'
      examples: [WEB]
    EstimateScheme:
      type: object
      required: [type, values]
      properties:
        type:
          type: string
          enum: [none, points, linear, tshirt]
        values:
          type: array
          description: Allowed estimate values in order (`tshirt` maps XS,S,M,L,XL to these numbers).
          items:
            type: number
    ProjectFeatures:
      type: object
      required: [cycles, modules, views, pages]
      properties:
        cycles:
          type: boolean
        modules:
          type: boolean
        views:
          type: boolean
        pages:
          type: boolean
    Project:
      type: object
      required:
        [id, workspaceId, identifier, name, icon, color, visibility, role, isMember, isFavorite, features, estimate,
         memberCount, openCount, totalCount, sortOrder, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        identifier:
          $ref: '#/components/schemas/ProjectIdentifier'
        name:
          type: string
        description:
          type: [string, 'null']
        icon:
          type: string
          description: Icon key from the UI's project icon set (e.g. `globe`, `smartphone`, `server`, `palette`).
        color:
          $ref: '#/components/schemas/Pastel'
        leadId:
          type: [string, 'null']
          format: uuid
        defaultAssigneeId:
          type: [string, 'null']
          format: uuid
        visibility:
          $ref: '#/components/schemas/ProjectVisibility'
        role:
          description: The caller's project role (`null` when not a member of a public project).
          oneOf:
            - $ref: '#/components/schemas/ProjectRole'
            - type: 'null'
        isMember:
          type: boolean
        isFavorite:
          type: boolean
        features:
          $ref: '#/components/schemas/ProjectFeatures'
        estimate:
          $ref: '#/components/schemas/EstimateScheme'
        memberCount:
          type: integer
        openCount:
          type: integer
          description: Items not in a completed/cancelled state.
        totalCount:
          type: integer
        sortOrder:
          type: number
        archivedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
    ProjectPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        nextCursor:
          type: [string, 'null']
    WorkflowTemplate:
      type: string
      description: Starter workflow for a new project.
      enum: [default, kanban, bugs]
    ProjectInput:
      type: object
      required: [name, identifier]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        identifier:
          $ref: '#/components/schemas/ProjectIdentifier'
        description:
          type: string
          maxLength: 2000
        icon:
          type: string
        color:
          $ref: '#/components/schemas/Pastel'
        leadId:
          type: string
          format: uuid
        visibility:
          $ref: '#/components/schemas/ProjectVisibility'
        memberIds:
          type: array
          items:
            type: string
            format: uuid
        workflow:
          $ref: '#/components/schemas/WorkflowTemplate'
    ProjectPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        identifier:
          $ref: '#/components/schemas/ProjectIdentifier'
        description:
          type: [string, 'null']
        icon:
          type: string
        color:
          $ref: '#/components/schemas/Pastel'
        leadId:
          type: [string, 'null']
          format: uuid
        defaultAssigneeId:
          type: [string, 'null']
          format: uuid
        visibility:
          $ref: '#/components/schemas/ProjectVisibility'
        features:
          $ref: '#/components/schemas/ProjectFeatures'
        estimate:
          $ref: '#/components/schemas/EstimateScheme'
        sortOrder:
          type: number
    ProjectMember:
      type: object
      required: [userId, role, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/ProjectRole'
        joinedAt:
          $ref: '#/components/schemas/Timestamp'
    ProjectMemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMember'
    ProjectMembersInput:
      type: object
      required: [members]
      properties:
        members:
          type: array
          minItems: 1
          items:
            type: object
            required: [userId, role]
            properties:
              userId:
                type: string
                format: uuid
              role:
                $ref: '#/components/schemas/ProjectRole'
    ProjectMemberPatch:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/ProjectRole'

    # ------------------------------------------------------------ workflow
    StateGroup:
      type: string
      description: Fixed groups every custom state belongs to; they drive progress and open/closed semantics.
      enum: [backlog, unstarted, started, completed, cancelled]
    WorkflowState:
      type: object
      required: [id, projectId, name, group, color, sequence, isDefault]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        group:
          $ref: '#/components/schemas/StateGroup'
        color:
          $ref: '#/components/schemas/Pastel'
        description:
          type: [string, 'null']
        sequence:
          type: number
          description: Order within the group (fractional).
        isDefault:
          type: boolean
          description: New items land here. Exactly one per project.
    StateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowState'
    WorkflowStateInput:
      type: object
      required: [name, group]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        group:
          $ref: '#/components/schemas/StateGroup'
        color:
          $ref: '#/components/schemas/Pastel'
        description:
          type: string
          maxLength: 280
        sequence:
          type: number
    WorkflowStatePatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        group:
          $ref: '#/components/schemas/StateGroup'
        color:
          $ref: '#/components/schemas/Pastel'
        description:
          type: [string, 'null']
        sequence:
          type: number
        isDefault:
          type: boolean
    Label:
      type: object
      required: [id, projectId, name, color, sequence]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: [string, 'null']
          format: uuid
          description: '`null` for workspace labels.'
        parentId:
          type: [string, 'null']
          format: uuid
          description: Label groups (one level).
        name:
          type: string
        color:
          $ref: '#/components/schemas/Pastel'
        description:
          type: [string, 'null']
        sequence:
          type: number
    LabelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Label'
    LabelInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        color:
          $ref: '#/components/schemas/Pastel'
        parentId:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 280
    LabelPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        color:
          $ref: '#/components/schemas/Pastel'
        parentId:
          type: [string, 'null']
          format: uuid
        description:
          type: [string, 'null']
        sequence:
          type: number

    # ------------------------------------------------------------ work items
    Priority:
      type: string
      enum: [urgent, high, medium, low, none]
    WorkItemType:
      type: string
      enum: [task, bug, story, improvement]
    WorkItemKey:
      type: string
      pattern: '^[A-Za-z][A-Za-z0-9]{1,4}-[0-9]+$'
      examples: [WEB-123]
    WorkItem:
      type: object
      description: List shape of a work item (no description). Counts are denormalized.
      required:
        [id, projectId, sequenceId, key, type, title, stateId, stateGroup, priority, assigneeIds, labelIds, estimate,
         startDate, dueDate, parentId, cycleId, moduleIds, sortOrder, createdById, createdAt, updatedAt, completedAt,
         archivedAt, subItemCount, subItemDoneCount, commentCount, attachmentCount, linkCount, version]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        sequenceId:
          type: integer
          minimum: 1
        key:
          $ref: '#/components/schemas/WorkItemKey'
        type:
          $ref: '#/components/schemas/WorkItemType'
        title:
          type: string
        stateId:
          type: string
          format: uuid
        stateGroup:
          $ref: '#/components/schemas/StateGroup'
        priority:
          $ref: '#/components/schemas/Priority'
        assigneeIds:
          type: array
          items:
            type: string
            format: uuid
        labelIds:
          type: array
          items:
            type: string
            format: uuid
        estimate:
          type: [number, 'null']
        startDate:
          oneOf:
            - $ref: '#/components/schemas/PlainDate'
            - type: 'null'
        dueDate:
          oneOf:
            - $ref: '#/components/schemas/PlainDate'
            - type: 'null'
        parentId:
          type: [string, 'null']
          format: uuid
        cycleId:
          type: [string, 'null']
          format: uuid
        moduleIds:
          type: array
          items:
            type: string
            format: uuid
        sortOrder:
          type: number
        createdById:
          type: string
          format: uuid
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        archivedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        subItemCount:
          type: integer
        subItemDoneCount:
          type: integer
        commentCount:
          type: integer
        attachmentCount:
          type: integer
        linkCount:
          type: integer
        development:
          description: Linked pull requests at a glance (GitHub integration); absent or `null` when none.
          oneOf:
            - $ref: '#/components/schemas/WorkItemDevSummary'
            - type: 'null'
        version:
          type: integer
    WorkItemRef:
      type: object
      description: Compact reference to another work item (relations, embeds, parents).
      required: [id, projectId, key, title, stateId, stateGroup, priority]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        key:
          $ref: '#/components/schemas/WorkItemKey'
        title:
          type: string
        stateId:
          type: string
          format: uuid
        stateGroup:
          $ref: '#/components/schemas/StateGroup'
        priority:
          $ref: '#/components/schemas/Priority'
    RelationType:
      type: string
      enum: [blocks, blocked_by, relates_to, duplicate_of, duplicated_by]
    WorkItemRelation:
      type: object
      required: [id, type, item, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/RelationType'
        item:
          $ref: '#/components/schemas/WorkItemRef'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    RelationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkItemRelation'
    RelationInput:
      type: object
      required: [type, itemId]
      properties:
        type:
          $ref: '#/components/schemas/RelationType'
        itemId:
          type: string
          format: uuid
    WorkItemLink:
      type: object
      required: [id, url, title, createdById, createdAt]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        title:
          type: string
        createdById:
          type: string
          format: uuid
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    LinkInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        title:
          type: string
          maxLength: 255
    WorkItemDetail:
      description: Full work item (detail page, peek).
      allOf:
        - $ref: '#/components/schemas/WorkItem'
        - type: object
          required: [descriptionHtml, parent, relations, links, subscriberIds, isSubscribed]
          properties:
            descriptionHtml:
              type: string
              description: Sanitized HTML from the editor (server re-sanitizes on write).
            parent:
              oneOf:
                - $ref: '#/components/schemas/WorkItemRef'
                - type: 'null'
            relations:
              type: array
              items:
                $ref: '#/components/schemas/WorkItemRelation'
            links:
              type: array
              items:
                $ref: '#/components/schemas/WorkItemLink'
            subscriberIds:
              type: array
              items:
                type: string
                format: uuid
            isSubscribed:
              type: boolean
    WorkItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkItem'
    WorkItemPage:
      type: object
      required: [items, nextCursor, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkItem'
        nextCursor:
          type: [string, 'null']
        totalCount:
          type: integer
          description: Matching items across all pages.
    WorkItemInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        type:
          $ref: '#/components/schemas/WorkItemType'
        descriptionHtml:
          type: string
        stateId:
          type: string
          format: uuid
        priority:
          $ref: '#/components/schemas/Priority'
        assigneeIds:
          type: array
          items:
            type: string
            format: uuid
        labelIds:
          type: array
          items:
            type: string
            format: uuid
        estimate:
          type: [number, 'null']
        startDate:
          oneOf:
            - $ref: '#/components/schemas/PlainDate'
            - type: 'null'
        dueDate:
          oneOf:
            - $ref: '#/components/schemas/PlainDate'
            - type: 'null'
        parentId:
          type: [string, 'null']
          format: uuid
        cycleId:
          type: [string, 'null']
          format: uuid
        moduleIds:
          type: array
          items:
            type: string
            format: uuid
        sortOrder:
          type: number
    WorkItemPatch:
      type: object
      description: Partial update; `null` clears.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        type:
          $ref: '#/components/schemas/WorkItemType'
        descriptionHtml:
          type: string
        stateId:
          type: string
          format: uuid
        priority:
          $ref: '#/components/schemas/Priority'
        assigneeIds:
          type: array
          items:
            type: string
            format: uuid
        labelIds:
          type: array
          items:
            type: string
            format: uuid
        estimate:
          type: [number, 'null']
        startDate:
          oneOf:
            - $ref: '#/components/schemas/PlainDate'
            - type: 'null'
        dueDate:
          oneOf:
            - $ref: '#/components/schemas/PlainDate'
            - type: 'null'
        parentId:
          type: [string, 'null']
          format: uuid
        cycleId:
          type: [string, 'null']
          format: uuid
        moduleIds:
          type: array
          items:
            type: string
            format: uuid
        sortOrder:
          type: number
    WorkItemMove:
      type: object
      required: [projectId]
      properties:
        projectId:
          type: string
          format: uuid
    WorkItemBatchUpdate:
      type: object
      required: [ids, patch]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid
        patch:
          $ref: '#/components/schemas/WorkItemPatch'
        addLabelIds:
          type: array
          description: Added to each item's labels (instead of replacing `labelIds`).
          items:
            type: string
            format: uuid
        removeLabelIds:
          type: array
          items:
            type: string
            format: uuid
        addAssigneeIds:
          type: array
          items:
            type: string
            format: uuid
        removeAssigneeIds:
          type: array
          items:
            type: string
            format: uuid
    WorkItemBatchIds:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid
        restore:
          type: boolean
          description: For batchArchive — restore instead of archive.
    WorkItemBatchResult:
      type: object
      required: [items, failed]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkItem'
        failed:
          type: array
          items:
            type: object
            required: [id, code]
            properties:
              id:
                type: string
                format: uuid
              code:
                type: string
    WorkItemGroup:
      type: object
      required: [key, count, points]
      properties:
        key:
          type: string
          description: Group value (state id, priority, user id, `none`, …).
        count:
          type: integer
        points:
          type: number
    WorkItemGroups:
      type: object
      required: [groupBy, groups, totalCount]
      properties:
        groupBy:
          $ref: '#/components/schemas/GroupBy'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/WorkItemGroup'
        totalCount:
          type: integer

    # ------------------------------------------------------------ collaboration
    CommentParentType:
      type: string
      enum: [work_item, page]
    CommentAnchor:
      type: object
      description: Inline page comment position (top-level block id + quoted text at creation time).
      required: [blockId, quote]
      properties:
        blockId:
          type: string
        quote:
          type: string
          maxLength: 500
    Reaction:
      type: object
      required: [emoji, count, userIds, reacted]
      properties:
        emoji:
          type: string
        count:
          type: integer
        userIds:
          type: array
          items:
            type: string
            format: uuid
        reacted:
          type: boolean
          description: The caller reacted with this emoji.
    ReactionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Reaction'
    ReactionInput:
      type: object
      required: [emoji]
      properties:
        emoji:
          type: string
          maxLength: 32
    Comment:
      type: object
      required: [id, parentType, parentId, authorId, bodyHtml, createdAt, reactions]
      properties:
        id:
          type: string
          format: uuid
        parentType:
          $ref: '#/components/schemas/CommentParentType'
        parentId:
          type: string
          format: uuid
        replyToId:
          type: [string, 'null']
          format: uuid
        authorId:
          type: string
          format: uuid
        bodyHtml:
          type: string
        anchor:
          oneOf:
            - $ref: '#/components/schemas/CommentAnchor'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        editedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        resolvedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        resolvedById:
          type: [string, 'null']
          format: uuid
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/Reaction'
    CommentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        nextCursor:
          type: [string, 'null']
    CommentInput:
      type: object
      required: [bodyHtml]
      properties:
        bodyHtml:
          type: string
          minLength: 1
          maxLength: 100000
        replyToId:
          type: string
          format: uuid
        anchor:
          $ref: '#/components/schemas/CommentAnchor'
    CommentPatch:
      type: object
      properties:
        bodyHtml:
          type: string
          minLength: 1
          maxLength: 100000
        resolved:
          type: boolean
    ActivityVerb:
      type: string
      enum: [created, updated, archived, restored, deleted, moved, commented, attached, linked, related, unrelated]
    ActivityField:
      type: string
      enum:
        [title, description, type, state, priority, assignees, labels, estimate, start_date, due_date, parent, cycle,
         modules, project]
    Activity:
      type: object
      description: One change. `from`/`to` are display snapshots (names, dates) taken at write time; ids for linking.
      required: [id, workItemId, actorId, verb, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workItemId:
          type: string
          format: uuid
        workItemKey:
          $ref: '#/components/schemas/WorkItemKey'
        projectId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        verb:
          $ref: '#/components/schemas/ActivityVerb'
        field:
          oneOf:
            - $ref: '#/components/schemas/ActivityField'
            - type: 'null'
        from:
          type: [string, 'null']
        to:
          type: [string, 'null']
        fromIds:
          type: array
          items:
            type: string
        toIds:
          type: array
          items:
            type: string
        via:
          description: Set when an integration made the change (a GitHub automation rule).
          oneOf:
            - $ref: '#/components/schemas/ActivityVia'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    ActivityPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
        nextCursor:
          type: [string, 'null']
    AttachmentParentType:
      type: string
      enum: [work_item, page, comment]
    Attachment:
      type: object
      required: [id, parentType, parentId, fileName, contentType, size, uploadedById, createdAt, downloadUrl]
      properties:
        id:
          type: string
          format: uuid
        parentType:
          $ref: '#/components/schemas/AttachmentParentType'
        parentId:
          type: string
          format: uuid
        fileName:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
        uploadedById:
          type: string
          format: uuid
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        downloadUrl:
          type: string
          description: '`/api/projects/attachments/{id}`'
        thumbnailUrl:
          type: [string, 'null']
        width:
          type: [integer, 'null']
        height:
          type: [integer, 'null']
    AttachmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
    AttachmentPatch:
      type: object
      required: [fileName]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
    UploadForm:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary

    # ------------------------------------------------------------ cycles / modules
    CycleStatus:
      type: string
      description: Derived from dates and completion. `draft` has no dates.
      enum: [draft, upcoming, active, completed]
    Progress:
      type: object
      required: [total, backlog, unstarted, started, completed, cancelled, totalPoints, completedPoints]
      properties:
        total:
          type: integer
        backlog:
          type: integer
        unstarted:
          type: integer
        started:
          type: integer
        completed:
          type: integer
        cancelled:
          type: integer
        totalPoints:
          type: number
        completedPoints:
          type: number
    Cycle:
      type: object
      required: [id, projectId, name, status, ownerId, isFavorite, progress, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        startDate:
          oneOf:
            - $ref: '#/components/schemas/PlainDate'
            - type: 'null'
        endDate:
          oneOf:
            - $ref: '#/components/schemas/PlainDate'
            - type: 'null'
        status:
          $ref: '#/components/schemas/CycleStatus'
        ownerId:
          type: string
          format: uuid
        isFavorite:
          type: boolean
        progress:
          $ref: '#/components/schemas/Progress'
        completedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
    CycleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Cycle'
    CycleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 2000
        startDate:
          $ref: '#/components/schemas/PlainDate'
        endDate:
          $ref: '#/components/schemas/PlainDate'
        ownerId:
          type: string
          format: uuid
    CyclePatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: [string, 'null']
        startDate:
          oneOf:
            - $ref: '#/components/schemas/PlainDate'
            - type: 'null'
        endDate:
          oneOf:
            - $ref: '#/components/schemas/PlainDate'
            - type: 'null'
        ownerId:
          type: string
          format: uuid
    CycleComplete:
      type: object
      required: [transferToCycleId]
      properties:
        transferToCycleId:
          type: [string, 'null']
          format: uuid
          description: Target cycle for unfinished items; `null` moves them to no cycle (backlog).
    BurndownPoint:
      type: object
      required: [date, ideal, remaining, completed]
      properties:
        date:
          $ref: '#/components/schemas/PlainDate'
        ideal:
          type: number
        remaining:
          type: [number, 'null']
          description: '`null` for future days.'
        completed:
          type: number
    Burndown:
      type: object
      required: [cycleId, metric, total, points]
      properties:
        cycleId:
          type: string
          format: uuid
        metric:
          $ref: '#/components/schemas/AnalyticsMetric'
        total:
          type: number
        points:
          type: array
          items:
            $ref: '#/components/schemas/BurndownPoint'
    ModuleStatus:
      type: string
      enum: [backlog, planned, in_progress, paused, completed, cancelled]
    ModuleLink:
      type: object
      required: [url, title]
      properties:
        url:
          type: string
          format: uri
        title:
          type: string
    Module:
      type: object
      required: [id, projectId, name, status, memberIds, isFavorite, progress, links, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/ModuleStatus'
        leadId:
          type: [string, 'null']
          format: uuid
        memberIds:
          type: array
          items:
            type: string
            format: uuid
        startDate:
          oneOf:
            - $ref: '#/components/schemas/PlainDate'
            - type: 'null'
        targetDate:
          oneOf:
            - $ref: '#/components/schemas/PlainDate'
            - type: 'null'
        isFavorite:
          type: boolean
        progress:
          $ref: '#/components/schemas/Progress'
        links:
          type: array
          items:
            $ref: '#/components/schemas/ModuleLink'
        archivedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
    ModuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Module'
    ModuleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 2000
        status:
          $ref: '#/components/schemas/ModuleStatus'
        leadId:
          type: string
          format: uuid
        memberIds:
          type: array
          items:
            type: string
            format: uuid
        startDate:
          $ref: '#/components/schemas/PlainDate'
        targetDate:
          $ref: '#/components/schemas/PlainDate'
    ModulePatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/ModuleStatus'
        leadId:
          type: [string, 'null']
          format: uuid
        memberIds:
          type: array
          items:
            type: string
            format: uuid
        startDate:
          oneOf:
            - $ref: '#/components/schemas/PlainDate'
            - type: 'null'
        targetDate:
          oneOf:
            - $ref: '#/components/schemas/PlainDate'
            - type: 'null'
        links:
          type: array
          items:
            $ref: '#/components/schemas/ModuleLink'

    # ------------------------------------------------------------ views
    GroupBy:
      type: string
      enum: [state, state_group, priority, assignee, label, cycle, module, type, project, created_by, none]
    OrderBy:
      type: string
      enum: [manual, priority, created_at, updated_at, due_date, start_date, estimate, key, title]
    OrderDirection:
      type: string
      enum: [asc, desc]
    DisplayProperty:
      type: string
      enum:
        [key, type, state, priority, assignees, labels, estimate, start_date, due_date, cycle, modules, sub_items,
         attachments, links, pull_requests, created_at, updated_at]
    DatePreset:
      type: string
      enum: [overdue, today, this_week, next_week, this_month, no_date]
    DateFilter:
      type: object
      properties:
        preset:
          $ref: '#/components/schemas/DatePreset'
        from:
          $ref: '#/components/schemas/PlainDate'
        to:
          $ref: '#/components/schemas/PlainDate'
    WorkItemFilter:
      type: object
      description: Saved filter. Array fields are OR within a field, AND across fields. Assignee/label/cycle/module accept `none` (and assignee/createdBy `me`).
      properties:
        projectIds:
          type: array
          items:
            type: string
            format: uuid
        stateIds:
          type: array
          items:
            type: string
            format: uuid
        stateGroups:
          type: array
          items:
            $ref: '#/components/schemas/StateGroup'
        priorities:
          type: array
          items:
            $ref: '#/components/schemas/Priority'
        assigneeIds:
          type: array
          items:
            type: string
        labelIds:
          type: array
          items:
            type: string
        cycleIds:
          type: array
          items:
            type: string
        moduleIds:
          type: array
          items:
            type: string
        types:
          type: array
          items:
            $ref: '#/components/schemas/WorkItemType'
        createdByIds:
          type: array
          items:
            type: string
        startDate:
          $ref: '#/components/schemas/DateFilter'
        dueDate:
          $ref: '#/components/schemas/DateFilter'
        q:
          type: string
        subscribedOnly:
          type: boolean
        includeArchived:
          type: boolean
        pullRequests:
          type: array
          items:
            $ref: '#/components/schemas/PullRequestFilter'
    DisplayOptions:
      type: object
      required: [layout, groupBy, orderBy, orderDirection, properties, showSubItems, showEmptyGroups]
      properties:
        layout:
          $ref: '#/components/schemas/LayoutKind'
        groupBy:
          $ref: '#/components/schemas/GroupBy'
        subGroupBy:
          oneOf:
            - $ref: '#/components/schemas/GroupBy'
            - type: 'null'
        orderBy:
          $ref: '#/components/schemas/OrderBy'
        orderDirection:
          $ref: '#/components/schemas/OrderDirection'
        properties:
          type: array
          items:
            $ref: '#/components/schemas/DisplayProperty'
        showSubItems:
          type: boolean
        showEmptyGroups:
          type: boolean
        calendarDateField:
          type: string
          enum: [due_date, start_date]
        timelineScale:
          type: string
          enum: [week, month, quarter]
        columnWidths:
          type: object
          description: Spreadsheet column widths (px) by property.
          additionalProperties:
            type: integer
    ViewAccess:
      type: string
      enum: [private, workspace]
    SavedView:
      type: object
      required: [id, workspaceId, projectId, name, filters, display, ownerId, access, isFavorite, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        projectId:
          type: [string, 'null']
          format: uuid
          description: '`null` for workspace views.'
        name:
          type: string
        description:
          type: [string, 'null']
        filters:
          $ref: '#/components/schemas/WorkItemFilter'
        display:
          $ref: '#/components/schemas/DisplayOptions'
        ownerId:
          type: string
          format: uuid
        access:
          $ref: '#/components/schemas/ViewAccess'
        isFavorite:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
    ViewList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SavedView'
    ViewInput:
      type: object
      required: [name, filters, display]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
        filters:
          $ref: '#/components/schemas/WorkItemFilter'
        display:
          $ref: '#/components/schemas/DisplayOptions'
        access:
          $ref: '#/components/schemas/ViewAccess'
    ViewPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: [string, 'null']
        filters:
          $ref: '#/components/schemas/WorkItemFilter'
        display:
          $ref: '#/components/schemas/DisplayOptions'
        access:
          $ref: '#/components/schemas/ViewAccess'

    # ------------------------------------------------------------ pages
    BlockType:
      type: string
      description: Known block (node) types of the editor. Unknown types are rejected with `projects.page.invalid_content`.
      enum:
        - doc
        - paragraph
        - text
        - heading
        - bulletList
        - orderedList
        - listItem
        - taskList
        - taskItem
        - toggle
        - toggleSummary
        - toggleContent
        - callout
        - blockquote
        - codeBlock
        - table
        - tableRow
        - tableHeader
        - tableCell
        - horizontalRule
        - image
        - file
        - workItemEmbed
        - viewEmbed
        - pageLink
        - mention
        - workItemMention
        - hardBreak
    BlockMark:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: '`bold`, `italic`, `underline`, `strike`, `code`, `link` (attrs.href), `highlight` (attrs.color), `comment` (attrs.commentId).'
        attrs:
          type: object
          additionalProperties: true
    Block:
      type: object
      description: |
        A ProseMirror node. Top-level blocks carry `attrs.id` (stable block id for links, comments, embeds).
        Attrs by type: heading `{level:1-3}`, taskItem `{checked}`, toggle `{open}`, callout `{tone: Pastel, icon}`,
        codeBlock `{language}`, image `{attachmentId, src, alt, width}`, file `{attachmentId, name, size}`,
        workItemEmbed `{itemId}`, viewEmbed `{viewId}`, pageLink `{pageId}`, mention `{userId}`, workItemMention `{itemId}`.
      required: [type]
      properties:
        type:
          type: string
        attrs:
          type: object
          additionalProperties: true
        content:
          type: array
          items:
            $ref: '#/components/schemas/Block'
        text:
          type: string
        marks:
          type: array
          items:
            $ref: '#/components/schemas/BlockMark'
    BlockDoc:
      type: object
      required: [type, content]
      properties:
        type:
          type: string
          const: doc
        content:
          type: array
          items:
            $ref: '#/components/schemas/Block'
    PageIcon:
      type: object
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [icon, emoji]
          description: '`icon` = key of the UI icon set on a pastel tile; `emoji` = one emoji chosen by the user.'
        value:
          type: string
        color:
          $ref: '#/components/schemas/Pastel'
    PageCover:
      type: object
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [pastel, image]
        value:
          type: string
          description: Pastel name, or an attachment download URL.
        offsetY:
          type: number
          description: Vertical focus 0–1 for image covers.
    PageAccess:
      type: string
      description: '`workspace` (wiki) / `project` (project members) / `private` (only the creator + explicit shares).'
      enum: [workspace, project, private]
    Page:
      type: object
      required:
        [id, workspaceId, projectId, parentId, title, icon, cover, sortOrder, access, isLocked, isFullWidth, isFavorite,
         isPublished, childCount, createdById, updatedById, createdAt, updatedAt, archivedAt, version]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        projectId:
          type: [string, 'null']
          format: uuid
          description: '`null` for wiki pages.'
        parentId:
          type: [string, 'null']
          format: uuid
        title:
          type: string
        icon:
          oneOf:
            - $ref: '#/components/schemas/PageIcon'
            - type: 'null'
        cover:
          oneOf:
            - $ref: '#/components/schemas/PageCover'
            - type: 'null'
        sortOrder:
          type: number
        access:
          $ref: '#/components/schemas/PageAccess'
        isLocked:
          type: boolean
        isFullWidth:
          type: boolean
        isFavorite:
          type: boolean
        isPublished:
          type: boolean
        childCount:
          type: integer
        wordCount:
          type: integer
        createdById:
          type: string
          format: uuid
        updatedById:
          type: string
          format: uuid
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        archivedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        version:
          type: integer
    PageDetail:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [content, canEdit, canComment]
          properties:
            content:
              $ref: '#/components/schemas/BlockDoc'
            canEdit:
              type: boolean
            canComment:
              type: boolean
            publicUrl:
              type: [string, 'null']
    PageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Page'
    PageInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        parentId:
          type: [string, 'null']
          format: uuid
        icon:
          $ref: '#/components/schemas/PageIcon'
        cover:
          $ref: '#/components/schemas/PageCover'
        access:
          $ref: '#/components/schemas/PageAccess'
        content:
          $ref: '#/components/schemas/BlockDoc'
        templateId:
          type: string
          format: uuid
          description: Copy title, icon and content from a template (explicit fields win).
        afterId:
          type: string
          format: uuid
          description: 'Insert after this sibling (default: last).'
    PagePatch:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        icon:
          oneOf:
            - $ref: '#/components/schemas/PageIcon'
            - type: 'null'
        cover:
          oneOf:
            - $ref: '#/components/schemas/PageCover'
            - type: 'null'
        access:
          $ref: '#/components/schemas/PageAccess'
        isLocked:
          type: boolean
        isFullWidth:
          type: boolean
    PageContentInput:
      type: object
      required: [content]
      properties:
        content:
          $ref: '#/components/schemas/BlockDoc'
    PageContentSaved:
      type: object
      required: [version, updatedAt, wordCount]
      properties:
        version:
          type: integer
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        wordCount:
          type: integer
    PageMove:
      type: object
      description: New position. `projectId` null + `parentId` null = wiki root.
      properties:
        projectId:
          type: [string, 'null']
          format: uuid
        parentId:
          type: [string, 'null']
          format: uuid
        afterId:
          type: [string, 'null']
          format: uuid
          description: Place after this sibling; `null` = first.
    PageVersion:
      type: object
      required: [id, pageId, version, title, authorIds, createdAt, reason]
      properties:
        id:
          type: string
          format: uuid
        pageId:
          type: string
          format: uuid
        version:
          type: integer
        title:
          type: string
        authorIds:
          type: array
          description: Everyone who edited since the previous snapshot.
          items:
            type: string
            format: uuid
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        reason:
          type: string
          enum: [autosave, publish, restore, manual]
    PageVersionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PageVersion'
        nextCursor:
          type: [string, 'null']
    PageVersionDetail:
      allOf:
        - $ref: '#/components/schemas/PageVersion'
        - type: object
          required: [content]
          properties:
            content:
              $ref: '#/components/schemas/BlockDoc'
    PageShareRole:
      type: string
      enum: [view, comment, edit, full]
    PageShare:
      type: object
      required: [principal, role]
      properties:
        principal:
          type: string
          enum: [workspace, member]
        userId:
          type: [string, 'null']
          format: uuid
        role:
          $ref: '#/components/schemas/PageShareRole'
    PageShareList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PageShare'
    PublishInput:
      type: object
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]{3,80}$'
        includeSubPages:
          type: boolean
    PublishInfo:
      type: object
      required: [isPublished, publicUrl, publishedAt]
      properties:
        isPublished:
          type: boolean
        publicUrl:
          type: string
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
    TemplateCategory:
      type: string
      enum: [meeting, spec, rfc, retro, onboarding, plan, other]
    PageTemplate:
      type: object
      required: [id, workspaceId, name, category, icon, content, isBuiltIn, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        category:
          $ref: '#/components/schemas/TemplateCategory'
        icon:
          $ref: '#/components/schemas/PageIcon'
        content:
          $ref: '#/components/schemas/BlockDoc'
        isBuiltIn:
          type: boolean
        createdById:
          type: [string, 'null']
          format: uuid
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    PageTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PageTemplate'
    PageTemplateInput:
      type: object
      required: [name, content]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 280
        category:
          $ref: '#/components/schemas/TemplateCategory'
        icon:
          $ref: '#/components/schemas/PageIcon'
        content:
          $ref: '#/components/schemas/BlockDoc'
    PageTemplatePatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: [string, 'null']
        category:
          $ref: '#/components/schemas/TemplateCategory'
        icon:
          $ref: '#/components/schemas/PageIcon'
        content:
          $ref: '#/components/schemas/BlockDoc'
    SaveAsTemplate:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        category:
          $ref: '#/components/schemas/TemplateCategory'

    # ------------------------------------------------------------ notifications
    NotificationKind:
      type: string
      enum:
        - assigned
        - unassigned
        - mentioned
        - commented
        - state_changed
        - priority_changed
        - due_soon
        - overdue
        - relation_added
        - cycle_started
        - cycle_ending
        - page_mentioned
        - page_commented
        - page_shared
    NotificationFilter:
      type: string
      enum: [all, unread, mentions, archived, snoozed]
    Notification:
      type: object
      required: [id, kind, actorId, projectId, workItemId, pageId, title, createdAt, readAt, archivedAt, snoozedUntil]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/NotificationKind'
        actorId:
          type: [string, 'null']
          format: uuid
        projectId:
          type: [string, 'null']
          format: uuid
        workItemId:
          type: [string, 'null']
          format: uuid
        workItemKey:
          oneOf:
            - $ref: '#/components/schemas/WorkItemKey'
            - type: 'null'
        pageId:
          type: [string, 'null']
          format: uuid
        commentId:
          type: [string, 'null']
          format: uuid
        title:
          type: string
          description: Snapshot of the item/page title.
        snippet:
          type: [string, 'null']
          description: Comment excerpt or change summary ("Todo → In progress").
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        readAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        archivedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        snoozedUntil:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    NotificationPage:
      type: object
      required: [items, nextCursor, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        nextCursor:
          type: [string, 'null']
        unreadCount:
          type: integer
    NotificationPatch:
      type: object
      properties:
        read:
          type: boolean
        archived:
          type: boolean
        snoozedUntil:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    MarkAllRead:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        before:
          $ref: '#/components/schemas/Timestamp'

    # ------------------------------------------------------------ favorites / recents
    FavoriteKind:
      type: string
      enum: [project, view, cycle, module, page]
    Favorite:
      type: object
      required: [kind, id, name, projectId, sortOrder]
      properties:
        kind:
          $ref: '#/components/schemas/FavoriteKind'
        id:
          type: string
          format: uuid
        name:
          type: string
        projectId:
          type: [string, 'null']
          format: uuid
        icon:
          oneOf:
            - $ref: '#/components/schemas/PageIcon'
            - type: 'null'
        sortOrder:
          type: number
    FavoriteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Favorite'
    FavoriteInput:
      type: object
      required: [kind, id]
      properties:
        kind:
          $ref: '#/components/schemas/FavoriteKind'
        id:
          type: string
          format: uuid
    RecentKind:
      type: string
      enum: [work_item, page, project, view, cycle, module]
    Recent:
      type: object
      required: [kind, id, title, projectId, visitedAt]
      properties:
        kind:
          $ref: '#/components/schemas/RecentKind'
        id:
          type: string
          format: uuid
        title:
          type: string
        key:
          oneOf:
            - $ref: '#/components/schemas/WorkItemKey'
            - type: 'null'
        projectId:
          type: [string, 'null']
          format: uuid
        visitedAt:
          $ref: '#/components/schemas/Timestamp'
    RecentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Recent'
    RecentInput:
      type: object
      required: [kind, id]
      properties:
        kind:
          $ref: '#/components/schemas/RecentKind'
        id:
          type: string
          format: uuid

    # ------------------------------------------------------------ search / analytics
    SearchHitKind:
      type: string
      enum: [work_item, page, project, cycle, module, view, member]
    SearchHit:
      type: object
      required: [kind, id, title, projectId]
      properties:
        kind:
          $ref: '#/components/schemas/SearchHitKind'
        id:
          type: string
          format: uuid
        title:
          type: string
        snippet:
          type: [string, 'null']
          description: Plain text with match ranges in `highlights`.
        highlights:
          type: array
          description: '[start, end) character ranges in `snippet` (or `title` when `snippet` is null).'
          items:
            type: array
            items:
              type: integer
            minItems: 2
            maxItems: 2
        key:
          oneOf:
            - $ref: '#/components/schemas/WorkItemKey'
            - type: 'null'
        projectId:
          type: [string, 'null']
          format: uuid
        stateGroup:
          oneOf:
            - $ref: '#/components/schemas/StateGroup'
            - type: 'null'
        updatedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    SearchResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
        nextCursor:
          type: [string, 'null']
    AnalyticsDimension:
      type: string
      enum: [state_group, state, priority, assignee, label, cycle, module, type, project, created_week, completed_week]
    AnalyticsMetric:
      type: string
      enum: [count, points]
    AnalyticsSegment:
      type: object
      required: [key, label, value]
      properties:
        key:
          type: string
        label:
          type: string
        value:
          type: number
    AnalyticsRow:
      type: object
      required: [key, label, value]
      properties:
        key:
          type: string
        label:
          type: string
        value:
          type: number
        segments:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsSegment'
    AnalyticsResponse:
      type: object
      required: [x, y, rows, total]
      properties:
        x:
          $ref: '#/components/schemas/AnalyticsDimension'
        y:
          $ref: '#/components/schemas/AnalyticsMetric'
        segment:
          oneOf:
            - $ref: '#/components/schemas/AnalyticsDimension'
            - type: 'null'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsRow'
        total:
          type: number
    TrendPoint:
      type: object
      required: [date, created, completed]
      properties:
        date:
          $ref: '#/components/schemas/PlainDate'
        created:
          type: integer
        completed:
          type: integer
    AnalyticsOverview:
      type: object
      required: [totals, trend, byPriority, byStateGroup, topAssignees]
      properties:
        totals:
          type: object
          required: [open, inProgress, completedLast30, createdLast30, overdue]
          properties:
            open:
              type: integer
            inProgress:
              type: integer
            completedLast30:
              type: integer
            createdLast30:
              type: integer
            overdue:
              type: integer
        trend:
          type: array
          description: Daily created vs completed over the last 30 days.
          items:
            $ref: '#/components/schemas/TrendPoint'
        byPriority:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsRow'
        byStateGroup:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsRow'
        topAssignees:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsRow'

    # ------------------------------------------------------------ import
    ImportSource:
      type: string
      enum: [jira, notion, plane, linear, csv]
    ImportStatus:
      type: string
      enum: [queued, running, completed, failed]
    ImportReport:
      type: object
      required: [projects, workItems, pages, comments, attachments, skipped, warnings]
      properties:
        projects:
          type: integer
        workItems:
          type: integer
        pages:
          type: integer
        comments:
          type: integer
        attachments:
          type: integer
        skipped:
          type: array
          items:
            type: object
            required: [ref, reason]
            properties:
              ref:
                type: string
              reason:
                type: string
        warnings:
          type: array
          items:
            type: string
    ImportJob:
      type: object
      required: [id, source, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/ImportSource'
        status:
          $ref: '#/components/schemas/ImportStatus'
        projectId:
          type: [string, 'null']
          format: uuid
        fileName:
          type: string
        progress:
          type: number
          description: 0–1 while running.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        finishedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        error:
          type: [string, 'null']
        report:
          oneOf:
            - $ref: '#/components/schemas/ImportReport'
            - type: 'null'

    # ------------------------------------------------------------ sync
    ChangeEntity:
      type: string
      enum:
        [workspace, member, project, project_member, state, label, work_item, comment, cycle, module, view, page,
         notification, favorite, integration, development]
    ChangeOp:
      type: string
      enum: [upsert, delete]
    Change:
      type: object
      required: [seq, entity, id, op, changedAt]
      properties:
        seq:
          type: string
          description: Sequence (decimal string; int64).
        entity:
          $ref: '#/components/schemas/ChangeEntity'
        id:
          type: string
          format: uuid
        op:
          $ref: '#/components/schemas/ChangeOp'
        workspaceId:
          type: [string, 'null']
          format: uuid
        projectId:
          type: [string, 'null']
          format: uuid
        parentId:
          type: [string, 'null']
          format: uuid
          description: For comments (the work item / page) and project members.
        changedAt:
          $ref: '#/components/schemas/Timestamp'
    ChangesResponse:
      type: object
      required: [since, cursor, hasMore, changes]
      properties:
        since:
          type: string
        cursor:
          type: string
          description: Pass as `since` next time.
        hasMore:
          type: boolean
        changes:
          type: array
          items:
            $ref: '#/components/schemas/Change'
    # ------------------------------------------------------------ integrations: GitHub
    GitHubInstallationStatus:
      type: string
      description: '`not_installed` (never connected or disconnected), `active`, `suspended` (suspended on GitHub), `error` (tokens failing).'
      enum: [not_installed, active, suspended, error]
    GitHubPermission:
      type: object
      description: One permission the GitHub App requests, with why we need it (shown before installing).
      required: [name, access, reason]
      properties:
        name:
          type: string
          description: GitHub permission name (`pull_requests`, `contents`, `metadata`, `issues`, `checks`).
        access:
          type: string
          enum: [read, write]
        reason:
          type: string
    GitHubDeliveryError:
      type: object
      required: [id, event, message, at]
      properties:
        id:
          type: string
          description: The `X-GitHub-Delivery` GUID.
        event:
          type: string
        message:
          type: string
        at:
          $ref: '#/components/schemas/Timestamp'
    GitHubHealth:
      type: object
      required: [lastWebhookAt, deliveries24h, failures24h, recentErrors]
      properties:
        lastWebhookAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        lastWebhookEvent:
          type: [string, 'null']
        deliveries24h:
          type: integer
        failures24h:
          type: integer
        rateLimitRemaining:
          type: [integer, 'null']
          description: Remaining REST calls of the installation token in the current hour.
        recentErrors:
          type: array
          description: Last failed deliveries (admins only; empty for others).
          items:
            $ref: '#/components/schemas/GitHubDeliveryError'
    GitHubInstallation:
      type: object
      required: [workspaceId, status, permissions, events, health]
      properties:
        workspaceId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/GitHubInstallationStatus'
        installationId:
          type: [integer, 'null']
          format: int64
        accountLogin:
          type: [string, 'null']
          description: The GitHub org or user the app is installed on (`acme-dev`).
        accountType:
          type: [string, 'null']
          enum: [organization, user, null]
        accountAvatarUrl:
          type: [string, 'null']
          format: uri
        repositorySelection:
          type: [string, 'null']
          enum: [all, selected, null]
        manageUrl:
          type: [string, 'null']
          format: uri
          description: github.com page to change repo access or uninstall.
        installedById:
          type: [string, 'null']
          format: uuid
        installedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        repositoryCount:
          type: integer
        permissions:
          type: array
          description: What the app asks for (shown on the connect screen even before installing).
          items:
            $ref: '#/components/schemas/GitHubPermission'
        events:
          type: array
          description: Webhook events the app subscribes to.
          items:
            type: string
        health:
          $ref: '#/components/schemas/GitHubHealth'
    GitHubConnectUrl:
      type: object
      required: [url, state, expiresAt]
      properties:
        url:
          type: string
          format: uri
          description: '`https://github.com/apps/<app>/installations/new?state=…`'
        state:
          type: string
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    GitHubConnectComplete:
      type: object
      required: [installationId, state]
      properties:
        installationId:
          type: integer
          format: int64
        state:
          type: string
        setupAction:
          type: string
          enum: [install, update, request]
    GitHubRepository:
      type: object
      required: [id, githubId, fullName, owner, name, private, defaultBranch, htmlUrl, linkedProjectIds]
      properties:
        id:
          type: string
          format: uuid
        githubId:
          type: integer
          format: int64
        fullName:
          type: string
          description: '`owner/name`'
        owner:
          type: string
        name:
          type: string
        private:
          type: boolean
        archived:
          type: boolean
        defaultBranch:
          type: string
        htmlUrl:
          type: string
          format: uri
        description:
          type: [string, 'null']
        language:
          type: [string, 'null']
        pushedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        linkedProjectIds:
          type: array
          items:
            type: string
            format: uuid
    ProjectRepoLink:
      type: object
      required: [id, projectId, repository, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        repository:
          $ref: '#/components/schemas/GitHubRepository'
        createdById:
          type: [string, 'null']
          format: uuid
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    ProjectRepoLinkInput:
      type: object
      required: [repositoryId]
      properties:
        repositoryId:
          type: string
          format: uuid
    AutomationTrigger:
      type: string
      description: PR lifecycle events a rule can react to.
      enum: [pr_opened, pr_ready_for_review, pr_merged, pr_closed]
    AutomationRule:
      type: object
      description: When `trigger` happens on a PR that closes/references an item, move the item to `targetStateId` (`null` = leave the state alone).
      required: [trigger, enabled, targetStateId]
      properties:
        trigger:
          $ref: '#/components/schemas/AutomationTrigger'
        enabled:
          type: boolean
        targetStateId:
          type: [string, 'null']
          format: uuid
        onlyClosingKeywords:
          type: boolean
          description: Apply only when the PR uses a closing magic word (`Fixes WEB-123`), not a plain reference (`Refs WEB-123`). Default true for `pr_merged`.
    ReferenceSources:
      type: object
      description: Where identifiers (`WEB-123`) are looked for to link branches, PRs and commits.
      required: [branchName, prTitle, prBody, commitMessage]
      properties:
        branchName:
          type: boolean
        prTitle:
          type: boolean
        prBody:
          type: boolean
        commitMessage:
          type: boolean
    IssueSyncMode:
      type: string
      description: '`off`; `import` (GitHub issues → new work items, one way); `two_way` (title, body, state, labels, assignees kept in sync).'
      enum: [off, import, two_way]
    IssueLabelMapping:
      type: object
      required: [githubLabel, labelId]
      properties:
        githubLabel:
          type: string
        labelId:
          type: string
          format: uuid
    IssueSync:
      type: object
      required: [mode, repositoryId, labelMappings, importExisting]
      properties:
        mode:
          $ref: '#/components/schemas/IssueSyncMode'
        repositoryId:
          type: [string, 'null']
          format: uuid
          description: Which linked repository's issues sync with this project.
        labelMappings:
          type: array
          items:
            $ref: '#/components/schemas/IssueLabelMapping'
        importExisting:
          type: boolean
          description: Also import issues that were open before sync was turned on.
        closedStateId:
          type: [string, 'null']
          format: uuid
          description: State for items whose issue is closed on GitHub (two-way and import).
    GitHubAutomationInput:
      type: object
      required: [references, rules, issueSync]
      properties:
        references:
          $ref: '#/components/schemas/ReferenceSources'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AutomationRule'
        issueSync:
          $ref: '#/components/schemas/IssueSync'
    GitHubAutomation:
      allOf:
        - $ref: '#/components/schemas/GitHubAutomationInput'
        - type: object
          required: [projectId, version, updatedAt]
          properties:
            projectId:
              type: string
              format: uuid
            version:
              type: integer
            updatedAt:
              $ref: '#/components/schemas/Timestamp'
    PullRequestStatus:
      type: string
      description: '`in_review` = open, not draft, with at least one requested reviewer or review.'
      enum: [draft, open, in_review, merged, closed]
    ChecksStatus:
      type: string
      enum: [success, failure, pending, none]
    ReviewState:
      type: string
      enum: [none, review_required, commented, changes_requested, approved]
    LinkSource:
      type: string
      description: How the link was made.
      enum: [branch_name, pr_title, pr_body, commit_message, manual, issue_sync]
    GitHubActor:
      type: object
      required: [login]
      properties:
        login:
          type: string
        avatarUrl:
          type: [string, 'null']
          format: uri
        userId:
          type: [string, 'null']
          format: uuid
          description: The matching workspace member (by verified email or a saved mapping), when known.
    ChecksSummary:
      type: object
      required: [status, passed, failed, pending]
      properties:
        status:
          $ref: '#/components/schemas/ChecksStatus'
        passed:
          type: integer
        failed:
          type: integer
        pending:
          type: integer
    PullRequest:
      type: object
      required: [id, repositoryId, repoFullName, number, title, htmlUrl, status, author, headBranch, baseBranch, checks, reviewState, additions, deletions, linkSource, closes, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        repositoryId:
          type: string
          format: uuid
        repoFullName:
          type: string
        number:
          type: integer
        title:
          type: string
        htmlUrl:
          type: string
          format: uri
        status:
          $ref: '#/components/schemas/PullRequestStatus'
        author:
          $ref: '#/components/schemas/GitHubActor'
        headBranch:
          type: string
        baseBranch:
          type: string
        checks:
          $ref: '#/components/schemas/ChecksSummary'
        reviewState:
          $ref: '#/components/schemas/ReviewState'
        additions:
          type: integer
        deletions:
          type: integer
        commitCount:
          type: integer
        linkSource:
          $ref: '#/components/schemas/LinkSource'
        closes:
          type: boolean
          description: The PR uses a closing magic word for this item (`Fixes`, `Closes`, `Resolves`).
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        mergedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        closedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    Branch:
      type: object
      required: [id, repositoryId, repoFullName, name, htmlUrl, createdAt]
      properties:
        id:
          type: string
          format: uuid
        repositoryId:
          type: string
          format: uuid
        repoFullName:
          type: string
        name:
          type: string
        htmlUrl:
          type: string
          format: uri
        author:
          oneOf:
            - $ref: '#/components/schemas/GitHubActor'
            - type: 'null'
        pullRequestNumber:
          type: [integer, 'null']
        deleted:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastCommitAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    Commit:
      type: object
      required: [sha, repoFullName, message, htmlUrl, author, committedAt]
      properties:
        sha:
          type: string
        repoFullName:
          type: string
        branch:
          type: [string, 'null']
        message:
          type: string
          description: First line of the commit message.
        htmlUrl:
          type: string
          format: uri
        author:
          $ref: '#/components/schemas/GitHubActor'
        committedAt:
          $ref: '#/components/schemas/Timestamp'
    DevelopmentEventKind:
      type: string
      enum: [branch_created, commits_pushed, pr_opened, pr_ready_for_review, pr_review_approved, pr_changes_requested, pr_checks_failed, pr_merged, pr_closed, pr_reopened, pr_linked]
    DevelopmentEvent:
      type: object
      description: One GitHub event on the item's timeline. `automation` is set when a rule moved the item.
      required: [id, kind, actor, repoFullName, at]
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/DevelopmentEventKind'
        actor:
          $ref: '#/components/schemas/GitHubActor'
        repoFullName:
          type: string
        number:
          type: [integer, 'null']
          description: PR number, when the event is about a PR.
        title:
          type: [string, 'null']
        ref:
          type: [string, 'null']
          description: Branch name or short SHA.
        count:
          type: [integer, 'null']
          description: Number of commits (`commits_pushed`).
        url:
          type: [string, 'null']
          format: uri
        automation:
          oneOf:
            - $ref: '#/components/schemas/AutomationApplied'
            - type: 'null'
        at:
          $ref: '#/components/schemas/Timestamp'
    AutomationApplied:
      type: object
      required: [trigger, fromStateId, toStateId]
      properties:
        trigger:
          $ref: '#/components/schemas/AutomationTrigger'
        fromStateId:
          type: string
          format: uuid
        toStateId:
          type: string
          format: uuid
    WorkItemDevelopment:
      type: object
      required: [workItemId, connected, pullRequests, branches, commits, events]
      properties:
        workItemId:
          type: string
          format: uuid
        connected:
          type: boolean
          description: The workspace has an active GitHub installation and the item's project has at least one linked repo.
        pullRequests:
          type: array
          description: Open first, then by most recently updated.
          items:
            $ref: '#/components/schemas/PullRequest'
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        commits:
          type: array
          description: Up to 20 most recent.
          items:
            $ref: '#/components/schemas/Commit'
        events:
          type: array
          description: Oldest first (merged into the activity timeline by the client).
          items:
            $ref: '#/components/schemas/DevelopmentEvent'
    WorkItemDevSummary:
      type: object
      description: Denormalized on `WorkItem` for row/card indicators and the PR filter; `null` when nothing is linked.
      required: [pullRequestCount, openCount, mergedCount, status, checks]
      properties:
        pullRequestCount:
          type: integer
        openCount:
          type: integer
          description: Draft, open or in review.
        mergedCount:
          type: integer
        status:
          $ref: '#/components/schemas/PullRequestStatus'
          description: The "most active" PR's status (in_review > open > draft > merged > closed).
        checks:
          $ref: '#/components/schemas/ChecksStatus'
        latest:
          oneOf:
            - $ref: '#/components/schemas/PullRequestRef'
            - type: 'null'
        branchCount:
          type: integer
    PullRequestRef:
      type: object
      required: [number, repoFullName, htmlUrl, status]
      properties:
        number:
          type: integer
        repoFullName:
          type: string
        htmlUrl:
          type: string
          format: uri
        status:
          $ref: '#/components/schemas/PullRequestStatus'
    PullRequestFilter:
      type: string
      description: '`open` = has a draft/open/in-review PR; `merged` = has a merged PR; `none` = no PR.'
      enum: [open, draft, merged, none]
    LinkPullRequestInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 500
    BranchNameSuggestion:
      type: object
      required: [branchName, command]
      properties:
        branchName:
          type: string
          description: '`<key lowercased>-<slugified title>`, at most 60 characters.'
        command:
          type: string
          description: '`git checkout -b <branchName>`'
    ActivityVia:
      type: object
      description: The change was made by an integration rather than directly by the actor.
      required: [source, label]
      properties:
        source:
          type: string
          enum: [github]
        label:
          type: string
          description: '`PR #482 in acme-dev/web`'
        url:
          type: [string, 'null']
          format: uri
