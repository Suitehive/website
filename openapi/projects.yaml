        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageShareList'
      responses:
        '200':
          description: Shares after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageShareList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
