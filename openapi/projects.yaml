      operationId: unpublishPage
      summary: Stop publishing.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Unpublished.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects/pages/{id}/comments:
    get:
      tags: [collaboration]
      operationId: listPageComments
      summary: Page comments (inline threads with `anchor`, and the page discussion).
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: resolved
          in: query
          schema:
