    post:
      tags: [integrations]
      operationId: linkProjectRepository
      summary: Link a repository to this project (project admins). A repo may serve several projects; references are matched by identifier.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRepoLinkInput'
      responses:
        '201':
          description: Linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRepoLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/projects/projects/{id}/integrations/github/repositories/{linkId}:
    delete:
      tags: [integrations]
      operationId: unlinkProjectRepository
      summary: Unlink a repository (project admins). Existing PR links on work items stay; new events from that repo stop matching this project.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: linkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Unlinked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/projects/{id}/integrations/github/automation:
    get:
      tags: [integrations]
      operationId: getGitHubAutomation
      summary: The project's GitHub automation (reference matching, PR → state rules, issue sync). Defaults exist for every project.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Automation settings.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubAutomation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [integrations]
      operationId: putGitHubAutomation
      summary: Replace the automation settings (project admins). `If-Match` enforced when sent. State ids must belong to this project.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubAutomationInput'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubAutomation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /api/projects/work-items/{id}/development:
    get:
      tags: [integrations]
      operationId: getWorkItemDevelopment
